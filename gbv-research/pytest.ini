[pytest]
# Unit test suite for gbv-research.
# Run from gbv-research/ with:  python -m pytest tests/unit/ -v
# Or from 2026 summer/ with:   python -m pytest gbv-research/tests/unit/ -v

testpaths    = tests/unit
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Show local variables on failure for easier debugging.
# NOTE: do NOT put -q here. The docs/CI invoke pytest with -q on the CLI;
# a second -q from addopts becomes -qq, which suppresses the "N passed" summary
# line (you'd see dots reach 100% then nothing). Let the CLI control verbosity.
addopts =
    --tb=short

# Markers used in the test suite
markers =
    slow: marks tests as slow (> 5 s; deselect with -m "not slow")
    gpu:  marks tests that require CUDA (skip with -m "not gpu")
