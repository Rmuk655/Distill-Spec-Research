# a100_llama.yaml — LLaMA-3.2-1B-Instruct → LLaMA-3.2-3B-Instruct, A100 40 GB
#
# Cross-family validation for the paper: proves tree losses and GBV verifier work
# across model families (Qwen3 is the primary; LLaMA-3.2 is the cross-family check).
#
# Why LLaMA over GPT-2 for cross-family paper evidence:
#   - Both models are instruction-tuned → have real math reasoning capability on GSM8K
#   - Same benchmark (GSM8K) as primary Qwen result → direct comparison
#   - Different architecture: LLaMA (grouped query attention, SwiGLU MLP, RoPE)
#     vs Qwen3 (different tokenizer, attention, MLP) → genuine "across families"
#   - GPT-2 is OOD on GSM8K (base model, not math-trained) → noise, not signal
#   - Reviewers value LLaMA (2024 SOTA) over GPT-2 (2019 legacy)
#
# HuggingFace gated access required:
#   Accept licence at https://huggingface.co/meta-llama/Llama-3.2-1B-Instruct
#   then run:  huggingface-cli login
#
# VRAM budget (A100-40GB):
#   LLaMA-3.2-1B draft  BF16  : 2.0 GB
#   LLaMA-3.2-3B target BF16  : 6.2 GB
#   LoRA r=8 + Adam            : 0.2 GB
#   Activations + KV cache     : 2-3 GB
#   Total                      : ~10-12 GB  → lots of headroom on A100-40GB
#
# Note: load_in_4bit: false — 3B fits easily in BF16 on A100-40GB.
# Compare: laptop_llama uses load_in_4bit: true for the 6GB laptop GPU.

_base: bases/a100   # A100 platform defaults (full eval suite, large val set)

models:
  family: llama
  draft:  meta-llama/Llama-3.2-1B-Instruct
  target: meta-llama/Llama-3.2-3B-Instruct    # BF16, ~6.2 GB — fits A100 easily

hardware:
  load_in_4bit: false    # BF16 — full precision, no quantization needed on A100-40GB
  compile: true          # torch.compile works on A100 Linux

training:
  steps: 2000
  lr: 5.0e-5             # slightly higher than Qwen — LLaMA adapts faster
  warmup_steps: 200      # 10% of 2000 steps
  grad_accum: 8          # 8 prompts per optimizer step (smaller than Qwen's 16 — 3B is faster)
  lora_r: 8              # 3× gap (1B→3B) is smaller than 13× (0.6B→8B) — r=8 sufficient
  lora_alpha: 16
  max_new_tokens: 128
  teacher_temperature: 1.0   # LLaMA does NOT pre-scale logits (unlike Qwen3)
  seed: 42
  grad_clip: 1.0
  lora_dropout: 0.05
  ebe_kl_weight: 0.1
  jsd_alpha: 0.5
  max_train_prompts: null  # full 7473 prompts — paper quality, no cap

logging:
  wandb_group: a100-llama
  run_label: "3B-a100-llama"
  experiment_tag: KrishnanRIITHServer

health:
  val_every: 200
  ppl_check_every: 500
  ppl_threshold: 1.25

checkpointing:
  save_every: 100
  milestone_every: 500
  max_checkpoints: 8

tree_training:
  tree_K: 4
  tree_L: 8

experiment:
  pipeline_ordering: per_loss
  # ebe excluded (not instruction-tuned-specific issue, just lower priority)
  losses: [kl, rev_kl, jsd, l1,
           kl_tree, rev_kl_tree, jsd_tree,
           bv_tree, gbv_tree, traversal_tree,
           naive_tree, nss_tree, specinfer_tree, spectr_tree, khisti_tree]
  exclude_losses: [ebe, ebe_single, ebe_tree,
                   online, online_ebe, online_ebe_single, online_kl_tree, online_ebe_tree]
