# a100.yaml — Qwen3-0.6B→8B BF16, A100-class GPU (≥ 19 GB VRAM)
# Inherits platform settings from bases/a100.yaml; adds Qwen model pair.
#
# Platforms: Google Colab Pro A100 40 GB, Lightning AI L40S 48 GB, RunPod A100.
# Draft: Qwen3-0.6B (~1.2 GB BF16)   Teacher: Qwen3-8B (~16 GB BF16)
# VRAM: 1.2 + 16 + ~2-3 activations = ~19-20 GB — fits A100 40 GB with room to spare.
#
# A100 vs T4 speed (Qwen3-0.6B, seq 128):
#   T4:   ~1-2 s/step   (500 steps ≈ 15-30 min training)
#   A100: ~0.3-0.5 s/step (2000 steps ≈ 10-17 min training)
#
# Usage:
#   python orchestration/experiment.py --config a100 \
#     --storage_root /content/drive/MyDrive/specdist
#
# Other A100 family configs (when needed):
#   a100_gpt2.yaml   → _base: bases/a100 + distilgpt2→gpt2-medium
#   a100_llama.yaml  → _base: bases/a100 + Llama-3.2-1B→3B

_base: bases/a100   # A100 hardware + full eval sweep + dataset — see bases/a100.yaml

models:
  family: qwen
  draft:  Qwen/Qwen3-0.6B
  target: Qwen/Qwen3-8B         # 16 GB BF16; fits A100 with ~20 GB to spare

training:
  # steps=4000, grad_accum=8 → exactly 500 optimizer updates.
  # Math: 4000 grad-steps / 8 = 500 opt-steps.  A100 at ~0.4s/step ≈ 27 min training.
  # This applies to ALL losses; tree losses are slower per step (~0.8s with K=4 paths)
  # so tree training ≈ 53 min.  500 opt-steps is the minimum for reliable convergence
  # signal on both flat and tree losses (warmup ends at opt-step 50 → 450 useful steps).
  steps: 4000
  # grad_accum=8: lower than previous 16 → 2× more frequent parameter updates.
  # For tree losses this matters: each opt-step uses K×batch_size gradient estimates
  # (K=4 paths × 1 prompt = 4 trajectory samples); more frequent updates = less stale.
  # Flat losses: no difference in theory, marginally faster wall-clock (8 < 16 syncs).
  grad_accum: 8
  # lr: default 3e-5 is fine for kl / rev_kl / jsd / traversal_tree and other losses.
  # bv_tree / gbv_tree: the BV block-acceptance integral (h_i denominator) amplifies
  # gradients vs per-token KL; tree_losses.py clamps for stability but training is
  # still safer at lower lr — override on CLI (do not change this field for one loss):
  #   python orchestration/experiment.py --config a100_qwen --losses bv_tree --lr 1e-5 --train_only --yes
  #   python orchestration/experiment.py --config a100_qwen --losses gbv_tree --lr 1e-5 --train_only --yes
  # (aip_run.py does not forward --lr; use experiment.py for bv_tree/gbv_tree runs.)
  lr: 3.0e-5
  warmup_steps: 400             # 10% of 4000 steps = 50 opt-steps; DistillSpec/EAGLE convention
  lora_r: 16                    # larger rank for wider teacher-student gap (8B→0.6B)
  lora_alpha: 32
  max_new_tokens: 128
  # grad_clip for tree losses: tree losses have inherently larger gradient norms than
  # flat losses because path weights (Π α_i) amplify the ∂log q/∂θ term.
  # For Qwen3 pair (baseline α≈0.93/token): w_path ≈ 0.55–1.0 → grad_norms 30–100.
  # grad_clip=5.0 allows larger steps while still preventing catastrophic updates.
  # Flat losses still benefit from 1.0 — override per loss on CLI if needed.
  grad_clip: 5.0
  # Training only — softens teacher logits during distillation.  Eval uses
  # evaluation.teacher_temps / draft_temp in bases/a100.yaml (usually 1.0 / 1.0).
  teacher_temperature: 0.8
  seed: 42
  lora_dropout: 0.05
  ebe_kl_weight: 0.1
  jsd_alpha: 0.5

logging:
  wandb_group: a100
  run_label: "8B-a100"

health:
  # ── Two-tier val design (fast gating + reliable selection) ───────────────────
  # Fast val (30 prompts, every 100 steps):
  #   - 30 × 1.5s = 45s/check → 40 checks × 45s = 30 min over 4000 steps
  #   - SE≈0.031: good enough to detect plateau/improvement, noisy for ranking
  #   - Drives early_stop_patience=5 (stop after 5 consecutive no-improve checks)
  #   - Saves ckpt_best (fast-val best — not used for eval merging)
  #
  # Slow val (100 prompts, every 500 steps):
  #   - 100 × 1.5s = 2.5 min/check → 8 checks × 2.5 min = 20 min over 4000 steps
  #   - SE≈0.017: reliable for final checkpoint selection
  #   - Saves ckpt_best_slow → eval pipeline merges THIS, not ckpt_best
  #   - Also feeds early_stop_patience so noisy fast-val bounces don't decide alone
  #
  # Total val overhead: 30 + 20 = 50 min over 4000 steps (acceptable vs 53 min tree train).
  # Rationale: 30-prompt val is a cheap gating metric ("better / not better");
  # 100-prompt slow val is the real ranking metric. Do not over-interpret fast-val
  # changes < 0.003 — that is noise at n=30. Trust the slow-val trend instead.
  val_every: 100
  slow_val_every: 500
  slow_val_n: 100
  early_stop_patience: 5
  ppl_check_every: 500

checkpointing:
  save_every: 100
  # milestone_every controls how many checkpoints are kept for the convergence curve sweep.
  # Paper requirement: need ≥8 evaluation points for a smooth BE/alpha vs step figure.
  #   milestone_every: 500  →  4 points  (too sparse — connect-the-dots)
  #   milestone_every: 200  →  10 points (good for paper — smooth, trend clear)
  # Storage cost: each milestone ≈ 1.2 GB (0.6B LoRA weights). 10 milestones = 12 GB/loss.
  # With 17 losses: 17 × 12 GB = 204 GB. On Pluto/specdist this is acceptable.
  # After the convergence sweep (deploy/eval_checkpoints.py), old milestones can be pruned.
  milestone_every: 200

logging:
  wandb_group: a100-qwen
  run_label: "8B-a100"
  # experiment_tag groups all eval cells from one session in results.db + dashboard.
  # Override on CLI: python deploy/aip_run.py --experiment_tag my_tag
  experiment_tag: KrishnanRIITHServer

# ── Eval scope: FINALIZATION vs PAPER CONFIRMATION ───────────────────────────
# Finalization defaults are now in bases/a100.yaml (eval_datasets, modes, n_prompts).
# bases/a100.yaml currently = finalization-safe values (see comments there).
#
# FINALIZATION (current — bases/a100.yaml defaults apply):
#   eval_datasets: [gsm8k]                                          1 dataset only
#   modes: [alpha, naive, nss, specinfer, spectr, khisti, bv, gbv, traversal]  all 9
#   n_prompts_gsm8k: 100                ~2–3 h per loss (9 cells × 15–20 min)
#   All 9 verifiers always: loss-verifier alignment is a core finding.
#   e.g. traversal_tree may not gain most from traversal verifier — need all 9 to see.
#
# PAPER CONFIRMATION — override in this file when top-3 losses are chosen:
#   evaluation:
#     eval_datasets: [gsm8k, alpaca, math500, humaneval, mtbench]
#     n_prompts_gsm8k: 1319
# ─────────────────────────────────────────────────────────────────────────────
# No evaluation: override needed here — bases/a100.yaml has the right finalization defaults.

experiment:
  pipeline_ordering: per_loss   # train → merge → eval per loss; results appear incrementally
  # ebe / ebe_single excluded: off-policy flat losses (optimise teacher-sampled tokens,
  # not draft proposals). Valid mathematically but not the paper contribution.
  # Keep as manual ablations only via --losses ebe if needed.
  losses: [kl, rev_kl, jsd, l1,
           kl_tree, rev_kl_tree, jsd_tree,
           bv_tree, gbv_tree, traversal_tree,
           naive_tree, nss_tree, specinfer_tree, spectr_tree, khisti_tree]
