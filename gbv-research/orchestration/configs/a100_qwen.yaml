# a100.yaml — Qwen3-0.6B→8B BF16, A100-class GPU (≥ 19 GB VRAM)
# Inherits platform settings from bases/a100.yaml; adds Qwen model pair.
#
# Platforms: Google Colab Pro A100 40 GB, Lightning AI L40S 48 GB, RunPod A100.
# Draft: Qwen3-0.6B (~1.2 GB BF16)   Teacher: Qwen3-8B (~16 GB BF16)
# VRAM: 1.2 + 16 + ~2-3 activations = ~19-20 GB — fits A100 40 GB with room to spare.
#
# A100 vs T4 speed (Qwen3-0.6B, seq 128):
#   T4:   ~1-2 s/step   (500 steps ≈ 15-30 min training)
#   A100: ~0.3-0.5 s/step (2000 steps ≈ 10-17 min training)
#
# Usage:
#   python orchestration/experiment.py --config a100 \
#     --storage_root /content/drive/MyDrive/specdist
#
# Other A100 family configs (when needed):
#   a100_gpt2.yaml   → _base: bases/a100 + distilgpt2→gpt2-medium
#   a100_llama.yaml  → _base: bases/a100 + Llama-3.2-1B→3B

_base: bases/a100   # A100 hardware + full eval sweep + dataset — see bases/a100.yaml

models:
  family: qwen
  draft:  Qwen/Qwen3-0.6B
  target: Qwen/Qwen3-8B         # 16 GB BF16; fits A100 with ~20 GB to spare

training:
  steps: 2000                   # A100 is ~4x faster; 2000 steps ≈ 15-20 min training
  lr: 3.0e-5
  warmup_steps: 200             # 10% of 2000 steps; DistillSpec/EAGLE convention
  grad_accum: 16
  lora_r: 16                    # larger rank for wider teacher-student gap (8B→0.6B)
  lora_alpha: 32
  max_new_tokens: 128
  teacher_temperature: 0.8
  seed: 42
  grad_clip: 1.0
  lora_dropout: 0.05
  ebe_kl_weight: 0.1
  jsd_alpha: 0.5

logging:
  wandb_group: a100
  run_label: "8B-a100"

health:
  val_every: 100
  ppl_check_every: 500

checkpointing:
  save_every: 100
  milestone_every: 500

logging:
  wandb_group: a100-qwen
  run_label: "8B-a100"
  # experiment_tag groups all eval cells from one session in results.db + dashboard.
  # Override on CLI: python deploy/aip_run.py --experiment_tag my_tag
  experiment_tag: KrishnanRIITHServer

# ── Training — paper confirmation hyperparams ──────────────────────────────
# CURRENT (exploration, Stage 2A):  steps=2000, lr=3e-5, tree_K=4
#
# Switch to these for Stage 2B (paper confirmation on top 4-5 losses):
#   steps: 5000      # 312 opt-steps at grad_accum=16 → fuller convergence
#                    # Math: 2000 steps = 125 opt-steps (same as laptop!); 5000 = 312
#   lr: 5.0e-5       # Compensates for lora_r=16 doubling trainable params vs r=8
#                    # (effective per-param LR halved at same lr → need 5/3e-5)
#   tree_K: 6        # Reduces cumprod variance: Var(Π α_i) ∝ 1/K
#                    # At baseline α≈0.93/tok: 6 paths give 6× more gradient samples
#
# To apply: update the training: section below and run clean_restart for that loss.
# ── Eval scope ────────────────────────────────────────────────────────────────
# TWO PHASES — change these settings when switching phases:
#
# EXPLORATION (current): rank all 17 losses quickly, pick top 4-5 winners.
#   n_prompts_gsm8k: 100      → ~40 min/eval  × 17 losses = ~11 h total
#   modes: 4 essential verifiers only
#
# PAPER CONFIRMATION (after winners chosen): full eval on top losses only.
#   n_prompts_gsm8k: 1319     → ~14-17h/eval × 5 losses  = ~70-85 h total
#   modes: all 9 verifiers (full loss-verifier alignment matrix)
#
# To switch to paper mode: change n_prompts_gsm8k → 1319, uncomment full modes.
# ─────────────────────────────────────────────────────────────────────────────
evaluation:
  # EXPLORATION: 100 prompts, 4 core verifiers (~40 min/eval)
  n_prompts_gsm8k: 100
  modes: [alpha, bv, gbv, traversal]
  K_values: [3]
  temperatures: [1.0]
  # PAPER (uncomment when confirming top losses):
  # n_prompts_gsm8k: 1319
  # modes: [alpha, naive, nss, specinfer, spectr, khisti, bv, gbv, traversal]

experiment:
  pipeline_ordering: per_loss   # train → merge → eval per loss; results appear incrementally
  losses: [kl, rev_kl, jsd, l1, ebe, ebe_single,
           kl_tree, rev_kl_tree, jsd_tree,
           bv_tree, gbv_tree, traversal_tree,
           naive_tree, nss_tree, specinfer_tree, spectr_tree, khisti_tree]
