# bases/a100.yaml — shared platform settings for A100-class GPU (≥ 19 GB VRAM).
#
# What belongs here:   A100 hardware, full eval sweep, dataset paths (larger
#                      val set), health, checkpointing, logging.
# What does NOT belong: models, training hparams (lr, steps, lora_r, teacher_temp),
#                       experiment.losses — those vary by model family.
#
# Leaf configs that inherit from this base:
#   a100.yaml          (_base: bases/a100 + Qwen3-0.6B→8B BF16)
#   a100_gpt2.yaml     (_base: bases/a100 + distilgpt2→gpt2-medium)   [when added]
#   a100_llama.yaml    (_base: bases/a100 + LLaMA 1B→3B)              [when added]
#
# To add a new model family on A100:
#   1. Create orchestration/configs/a100_<family>.yaml with _base: bases/a100
#   2. Add models.family/draft/target and training.lr/steps/lora_r/teacher_temperature
#   3. Add experiment.exclude_losses if the family has unsupported losses
#   Done — hardware, eval, health, dataset all inherited automatically.

hardware:
  device: cuda
  hw_tier: a100
  load_in_4bit: false   # A100 40 GB fits any model in BF16; override to true only if needed
  compile: true         # torch.compile reliable on A100 (Linux); ~10-30% speedup

dataset:
  train: core/datasets/raw/gsm8k_train.jsonl
  eval:  core/datasets/raw/gsm8k_30.jsonl
  val_dataset: gsm8k_30.jsonl
  # ── Val set sizing: EXPLORATION vs PAPER CONFIRMATION ──────────────────────
  # Val cost: teacher greedy-generate n_val prompts (128 tok each) + student fwd.
  # On A100-40GB with Qwen3-8B: ~1.5s/prompt → n=30: 45s/check, n=100: 2.5 min/check.
  # With val_every=200: 10 checks × 45s = 7.5 min total val (vs 27 min flat training).
  #
  # EXPLORATION (current — this file):
  #   val_dataset: gsm8k_30.jsonl   SE≈0.031 → detects >6% changes  (good enough for ranking)
  #   val_every:   200              → 10 checks over 2000 steps
  #   Total val overhead: 10 × 45s = 7.5 min  ← does NOT dominate training
  #
  # PAPER CONFIRMATION (switch when finalising top-3 losses):
  #   val_dataset: gsm8k_100.jsonl  SE≈0.017 → detects >3% changes  (paper-quality)
  #   val_every:   100              → 20 checks over 2000 steps
  #   Total val overhead: 20 × 2.5 min = 50 min  ← worth it for final numbers
  #
  # To switch for paper confirmation, in a100_qwen.yaml add:
  #   dataset:
  #     val_dataset: gsm8k_100.jsonl
  #   health:
  #     val_every: 100

checkpointing:
  max_checkpoints: 8
  # storage_root is NOT set here — pass --storage_root on CLI or via STORAGE_ROOT env var.
  # e.g.  export STORAGE_ROOT=~/specdist  or  --storage_root /path/to/persistent/storage
  # Colab: /content/drive/MyDrive/specdist
  # AIP/Pluto: ~/specdist  (set by aip_gpu_setup.sh)

logging:
  log_every: 10
  wandb_project: distillspec

health:
  nan_action: stop              # A100 sessions are stable; stop on NaN rather than skipping
  ppl_threshold: 1.25
  # Dual-val is configured per leaf config (a100_qwen.yaml) because the optimal
  # cadence depends on model family speed (Qwen3-8B vs LLaMA-3B vs GPT-2 etc.).
  # Defaults here: fast val every 100 steps, no slow val, no early stop.
  # Override in leaf config:
  #   health:
  #     val_every: 100           # fast (30 prompts)
  #     slow_val_every: 500      # slow (100 prompts)
  #     slow_val_n: 100
  #     early_stop_patience: 5
  val_every: 100

evaluation:
  # ── TWO PHASES — override in leaf config when switching ──────────────────────
  #
  # FINALIZATION (current default — ranking losses, not paper numbers):
  #   eval_datasets: [gsm8k]                    ← 1 dataset only
  #   modes: [alpha, bv, gbv, traversal]         ← 4 modes (leaf override)
  #   n_prompts_gsm8k: 100                       ← 100 prompts (leaf override)
  #   Per-loss eval time: ~1–1.5 h  (4 cells × ~15–20 min each)
  #   Why: multi-dataset (alpaca/math500/humaneval/mtbench) adds 5× more cells.
  #        naive/nss/spectr/khisti add 5 more modes.  Neither helps rank losses.
  #        Those 5 datasets are for the paper's generalization claim — run them
  #        once per TOP-3 loss after finalization, not for every candidate.
  #
  # PAPER CONFIRMATION (Stage 2B — after top-3 losses chosen):
  #   eval_datasets: [gsm8k, alpaca, math500, humaneval, mtbench]
  #   modes: [alpha, naive, nss, specinfer, spectr, khisti, bv, gbv, traversal]
  #   n_prompts_gsm8k: 1319                      ← full test set
  #   Per-loss eval time: ~8–14 h (45 cells × ~12–20 min each)
  #
  # Base defaults = finalization-safe values.  Paper values live as comments.
  # All 9 verifiers always: the loss-verifier alignment (which verifier gains most
  # from which training objective) is a core finding, not just a paper artifact.
  # e.g. traversal_tree may benefit traversal verifier most, but naive or nss
  # could surprise — you won't see that without running all 9.
  modes: [alpha, naive, nss, specinfer, spectr, khisti, bv, gbv, traversal]
  K_values: [3]
  temperatures: [1.0]
  L: 8
  n_prompts: 100
  n_prompts_gsm8k: 100               # paper: 1319 (full GSM8K test set)
  eval_datasets: [gsm8k]             # paper: [gsm8k, alpaca, math500, humaneval, mtbench]
  # task_score batch size: how many prompts to generate simultaneously.
  # Roofline: optimal ≈ FLOPs_peak / (params_bytes × HBM_BW)
  # A100-40GB + Qwen3-0.6B BF16: 312e12 / (1.2e9 × 2039e9) ≈ 127 → use 32 (safe margin)
  # A100-40GB + Qwen3-8B BF16:   312e12 / (16e9  × 2039e9) ≈ 9.6 → use 8 (teacher scoring)
  task_batch: 32

tree_training:
  tree_K: 4
  tree_L: 8

experiment:
  # Flat EBE losses are off-policy in the offline trainer: they optimise
  # teacher-sampled tokens rather than draft proposals. Keep them as manual
  # ablations only; tree losses provide verifier-aligned objectives.
  exclude_losses: [ebe, ebe_single]
