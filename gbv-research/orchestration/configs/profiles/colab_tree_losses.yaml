# Profile: colab_tree_losses — Tree-structured distillation loss family on Colab T4
#
# Hardware: Google Colab free T4 (15 GB VRAM)
# Teacher:  Qwen3-4B  (plain BF16, ~8 GB)  — NOT 8B (8B requires 4-bit NF4
#           which causes SIGKILL on Colab via CPU-RAM spike; 4B fits BF16 fine)
# Draft:    Qwen3-0.6B (LoRA, BF16, ~1.2 GB)
# VRAM budget:  1.2 (draft) + 8.0 (teacher) + ~1.5 (activations)
#             + ~2.0 (K=4 tree paths overhead) = ~12.7 GB  →  T4 fits with 2 GB spare
#
# Steps: 500 per loss — enough for a clear trend signal on T4.
# For paper-quality numbers use profiles/a100_tree_losses (Qwen3-8B, 2000 steps).
#
# Same 9 losses as the A100 profile:
#   7 offline: kl_tree, rev_kl_tree, jsd_tree, bv_tree, gbv_tree,
#              traversal_tree, ebe_tree
#   2 online:  online_kl_tree, online_ebe_tree
#
# Evaluation: non-OT verifiers only (bv, gbv, traversal) — same rationale
# as A100.  experiment.py hardcodes _TREE_NON_OT = "bv,gbv,traversal".
#
# Usage:
#   # Smoke test first (~10 min):
#   python orchestration/experiment.py --config profiles/colab_tree_losses --smoke --yes \
#     --storage_root /content/drive/MyDrive/specdist
#
#   # Single loss:
#   python orchestration/experiment.py --config profiles/colab_tree_losses --yes \
#     --losses kl_tree --storage_root /content/drive/MyDrive/specdist
#
#   # All 9 losses (~3-4 h on T4):
#   python orchestration/experiment.py --config profiles/colab_tree_losses --yes \
#     --storage_root /content/drive/MyDrive/specdist
#
#   # Quick trend check with 1.7B teacher instead (colab_lite settings):
#   python orchestration/experiment.py --config profiles/colab_lite_tree_losses --yes \
#     --losses kl_tree --storage_root /content/drive/MyDrive/specdist

hardware:
  device: cuda
  load_in_4bit: false           # Qwen3-4B fits T4 in bfloat16 — no quantization needed
  compile: false                # torch.compile not reliable in Colab environments

models:
  family: qwen
  draft:  Qwen/Qwen3-0.6B
  target: Qwen/Qwen3-4B        # BF16, ~8 GB VRAM — safe on T4 (not 8B which OOMs)

training:
  steps: 500                   # ~20-40 min per loss on T4; all 9 ≈ 3-4 h
  lr: 3.0e-5
  lora_r: 8                    # keep small for T4 VRAM budget
  lora_alpha: 16
  max_new_tokens: 96
  teacher_temperature: 0.8
  seed: 42

dataset:
  train: core/datasets/raw/gsm8k_train.jsonl
  eval:  core/datasets/raw/gsm8k_30.jsonl

# ── Tree-structured loss hyperparameters ────────────────────────────────────
# tree_K ≤ 4: each path adds ~tree_L teacher forward steps to Phase B.
# K=4 adds ~2 GB VRAM overhead — safe on T4 with 4B teacher.
# gbv_tree is numerically stable only at K ≤ 4 (q_skew integral).
# tree_L must match evaluation.L so training and eval share the same block depth.
tree_training:
  tree_K: 4
  tree_L: 8

checkpointing:
  save_every: 25               # ~1-2 min on T4 — Colab sessions die without warning
  milestone_every: 100
  max_checkpoints: 5
  storage_root: /content/drive/MyDrive/specdist

logging:
  log_every: 10
  wandb_project: distillspec
  wandb_group: colab-t4-tree
  run_label: "4B-T4-tree"

health:
  val_every: 50
  ppl_check_every: 100
  ppl_threshold: 1.25
  nan_action: skip             # skip rather than stop — T4 sessions are precious
  early_stop_patience: 5

evaluation:
  modes: [bv, gbv, traversal]  # non-OT verifiers only (matches tree loss design)
  K_values: [3]                 # K=3 only: K=5 adds wall time without scientific value on T4
  teacher_temps: [1.0]           # T=1.0: DistillSpec/EAGLE paper standard
  L: 8                          # must match tree_training.tree_L
  n_prompts: 20                 # fewer for speed on T4

experiment:
  losses:
    # ── Offline tree losses (7) ─────────────────────────────────────────────
    - kl_tree           # on-policy forward KL; primary H5 comparison point
    - rev_kl_tree       # mode-seeking variant
    - jsd_tree          # symmetric; bounded [0, log 2]
    - bv_tree           # targets bv_verify directly
    - gbv_tree          # targets gbv_verify (q_skew; stable at K≤4)
    - traversal_tree    # targets traversal_verify leaf-weight product
    - ebe_tree          # on-policy EBE ablation (off-policy mismatch test)
    # ── Online tree variants (2) ────────────────────────────────────────────
    - online_kl_tree    # H6: online tree > flat online on non-OT verifiers?
    - online_ebe_tree   # online EBE ablation
