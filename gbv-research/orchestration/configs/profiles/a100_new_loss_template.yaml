# Profile: a100_new_loss_template — Add a new trained loss and verify across all verifiers
#
# Purpose: Template for evaluating a new distillation loss alongside the baselines.
#          Trains only the new loss. Eval steps run for the new loss AND the baselines
#          (whose checkpoints must already exist from a100_baseline_losses).
#
#          This is the "does our new idea beat the baselines on every verifier?" check.
#
# Run order in the 3-profile A100 workflow:
#   Step 1 → a100_baseline_losses.yaml  (establishes kl/jsd/l1/online checkpoints)
#   Step 2 → a100_verifier_sweep.yaml   (deep verifier characterisation of baselines)
#   Step 3 → THIS FILE (customised)     (train new loss; compare against baselines)
#
# HOW TO USE THIS TEMPLATE
# ------------------------
# 1. Copy this file:
#      cp profiles/a100_new_loss_template.yaml profiles/a100_ebe_v2.yaml
#      cp profiles/a100_new_loss_template.yaml profiles/a100_gbv_loss.yaml
#
# 2. Edit the experiment.losses list:
#    - For training ONLY the new loss (fastest — baseline checkpoints already exist):
#        losses: [ebe]            # trains ebe; evals ebe + kl/jsd/l1/online (Phase 3/4)
#
#    - For training new loss AND re-running baseline evals together:
#        losses: [ebe, kl, jsd, l1, online]
#        (only new loss trains if baseline checkpoints exist via done_check skip)
#
# 3. Rename logging fields:
#      wandb_group: colab-a100-ebe-v2
#      run_label: "8B-A100-ebe-v2"
#
# 4. Run:
#      python orchestration/experiment.py --config profiles/a100_ebe_v2 --yes \
#        --storage_root /content/drive/MyDrive/specdist
#
# Current candidates for new losses (see RUN_LOG.md parking lot):
#   ebe        — EBE with full tree acceptance loop (rewrite pending — Rahul)
#   gbv        — GBV-specific loss after hyperparameter sweep (pending — Rahul)
#   rev_kl     — reverse KL ablation (quick to add; assessment pending)

hardware:
  device: cuda
  load_in_4bit: false
  compile: true

models:
  family: qwen
  draft:  Qwen/Qwen3-0.6B
  target: Qwen/Qwen3-8B

training:
  steps: 2000
  lr: 3.0e-5
  lora_r: 16
  lora_alpha: 32
  max_new_tokens: 128
  teacher_temperature: 0.8
  seed: 42

dataset:
  train: core/datasets/raw/gsm8k_train.jsonl
  eval:  core/datasets/raw/gsm8k_30.jsonl

checkpointing:
  save_every: 100
  milestone_every: 500
  max_checkpoints: 8
  storage_root: /content/drive/MyDrive/specdist

logging:
  log_every: 10
  wandb_project: distillspec
  wandb_group: colab-a100-new-loss          # ← rename to e.g. colab-a100-ebe-v2
  run_label: "8B-A100-new-loss"             # ← rename to e.g. 8B-A100-ebe-v2

health:
  val_every: 100
  ppl_check_every: 500
  ppl_threshold: 1.25
  nan_action: stop
  early_stop_patience: 5

evaluation:
  modes: [alpha, bv, gbv, traversal, specinfer, naive]
  K_values: [1, 3, 5, 8]
  L: 8
  n_prompts: 50

# ── Experiment scope ─────────────────────────────────────────────────────────
# Edit losses: below. Keep eval steps for baseline losses so the paper table
# shows the new loss side-by-side with kl/jsd/l1/online.
experiment:
  losses: [YOUR_LOSS_HERE, kl, jsd, l1, online]
  #                ↑ replace with the new loss name (must exist in ALL_LOSSES)
  #
  # The pipeline will:
  #   - TRAIN only YOUR_LOSS_HERE (kl/jsd/l1/online checkpoints exist → done_check skips)
  #   - EVAL all five losses on gsm8k (Phase 3) and multi-dataset (Phase 4)
  #
  # Valid flat-sequence loss names (from experiment.py ALL_LOSSES):
  #   kl  ebe  ebe_single  rev_kl  jsd  l1  online  online_ebe  online_ebe_single
  #
  # Valid tree-structured loss names (non-OT verifiers only):
  #   kl_tree        — on-policy KL at each tree node; universal baseline
  #   bv_tree        — targets bv_verify block-acceptance integral
  #   gbv_tree       — targets gbv_verify (bv with q_skew substituted)
  #   traversal_tree — targets traversal_verify leaf-weight product
  #
  # For tree losses, also set tree_training.tree_K and tree_training.tree_L below.
  # NOTE: gbv_tree is numerically stable only for tree_K ≤ 4 (see compute_skew in
  # otlp_registry.py).

# ── Tree-loss hyperparameters (only needed when losses includes a *_tree loss) ──
tree_training:
  tree_K: 4     # paths per step; keep ≤ 4 for gbv_tree (numerical stability)
  tree_L: 8     # block depth; should match evaluation L
