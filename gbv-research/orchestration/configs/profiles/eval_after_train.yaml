# Profile: eval_after_train — Evaluate already-trained checkpoints (NO training)
# =============================================================================
# PURPOSE      : The deferred-eval companion to train_one_loss. After one or more
#                train_only sessions have produced checkpoints, run THIS to measure
#                block efficiency / alpha / task_score under the verifiers — at
#                paper-standard eval params (K=3, T=1.0). Separating eval from
#                training means a training session never wastes GPU time on eval,
#                and eval can batch several checkpoints in one later session.
#
# HARDWARE     : Kaggle T4 x2 (dual GPU, sm_75), Qwen3-8B teacher 4-bit NF4.
#                Do NOT use P100 (sm_60 — incompatible with PyTorch 2.10+cu128).
#                T4 x2 is the only working GPU on Kaggle (no single T4 available).
#                Burns 2× quota (~15 effective h/wk from 30 GPU-h/wk budget).
#
# EXPECTED RUN : ~0.2-0.4 h per checkpoint-batch across the listed verifiers at
#                n=100, K=3 (traversal/gbv are slowest). Several checkpoints fit a
#                single session. --skip_existing means re-runs never recompute a
#                cell already in results.db.
#
# PRODUCES     : runs / per_prompt rows in results.db — alpha_mean, alpha_ci95,
#                block_eff, throughput, ms_per_tok, task_score — for each
#                (checkpoint x verifier x K x T) cell. These are DIRECTION-ONLY
#                free-tier numbers (1 seed, n=100), never the published numbers.
#
# DOES NOT     : Train or merge anything (experiment.eval_only drops all Phase-2
#                steps). Eval steps are BLOCKED if the matching merged model does
#                not exist — train it first with train_one_loss.
#
# WHICH LOSSES : Defaults to forward_kl. Pass --losses to evaluate exactly the
#                checkpoints you trained, e.g.:
#                  --losses kl              (the Phase-1 baseline checkpoint)
#                  --losses kl_tree,gbv_tree (two trained tree variants in one batch)
#                --losses always wins over the YAML default.
#
# USAGE (run from gbv-research/ on Kaggle, AFTER train_one_loss sessions):
#   python orchestration/experiment.py --config profiles/eval_after_train --yes \
#     --losses kl --skip_existing --storage_root /kaggle/working/specdist \
#     --experiment_tag eval_wk2
#
#   # Batch-eval several trained checkpoints at once:
#   python orchestration/experiment.py --config profiles/eval_after_train --yes \
#     --losses kl,kl_tree,gbv_tree --skip_existing \
#     --storage_root /kaggle/working/specdist --experiment_tag eval_wk3
#
# NOTE: --skip_existing is the discipline here — re-run freely after a crash; only
#       missing cells are computed.

hardware:
  device: cuda
  load_in_4bit: true            # Qwen3-8B NF4 — Kaggle (29 GB RAM) only, not Colab
  compile: false

models:
  family: qwen
  draft:  Qwen/Qwen3-0.6B
  target: Qwen/Qwen3-8B

training:
  steps: 1000                   # ignored — eval_only skips all training
  lr: 3.0e-5
  lora_r: 8
  lora_alpha: 16
  max_new_tokens: 96
  teacher_temperature: 0.8
  seed: 42

dataset:
  train: core/datasets/raw/gsm8k_train.jsonl
  eval:  core/datasets/raw/gsm8k_30.jsonl

tree_training:
  tree_K: 4
  tree_L: 8

checkpointing:
  save_every: 25
  milestone_every: 100
  max_checkpoints: 5
  storage_root: /kaggle/working/specdist

logging:
  log_every: 10
  wandb_project: distillspec
  wandb_group: kaggle-t4x2-eval
  run_label: "8B-T4x2-eval"

health:
  val_every: 50
  ppl_check_every: 100
  ppl_threshold: 1.25
  nan_action: skip
  early_stop_patience: 5

evaluation:
  # Paper-standard eval params (K=3, T=1.0). Modes cover the non-OT verifiers the
  # tree losses are aligned to (bv, gbv, traversal) plus specinfer + naive as
  # universal references. NOTE: for tree-loss eval steps experiment.py hardcodes
  # _TREE_NON_OT = "bv,gbv,traversal"; these modes apply to flat-loss eval.
  modes: [bv, gbv, traversal, specinfer, naive]
  K_values: [3]                 # K=3 only on free tier; K=5 is reserved for A100
  teacher_temps: [1.0]           # T=1.0 — DistillSpec/EAGLE paper standard
  L: 8                          # must match tree_training.tree_L used during training
  n_prompts: 100                # free-tier exploration size (full 1319 is A100-only)

experiment:
  eval_only: true               # SKIP all Phase-2 train/merge. Eval existing ckpts only.
  losses: [kl]                  # default = forward_kl. Override via --losses.
