# Profile: train_one_loss — Train EXACTLY ONE loss + LIGHT BE sanity (tiered)
# =============================================================================
# PURPOSE      : The Phase-1 benchmarking workhorse. One free-tier GPU session
#                does a TIERED run: train + val_loss curves + a LIGHT BE sanity
#                (1 matched verifier, K=3, n=100); the heavy full-GSM8K eval is
#                deferred to eval_after_train.yaml / the A100 confirmation.
#                Concretely it runs train -> merge -> ONE light GSM8K post-train
#                eval (single verifier), and DROPS the baseline eval (group 0) and
#                the Phase-4 multi-dataset sweep (via experiment.light_eval).
#                The val_loss curve is produced INSIDE trainer.py (health.val_every)
#                during training regardless of the BE eval — it is the
#                train-down / val-up overfit signal.
#                (For a deliberate pure-training burn with NO eval at all, set
#                 experiment.train_only: true or pass --train_only instead.)
#
# HARDWARE     : Kaggle T4 x2 (dual GPU, sm_75). Qwen3-8B teacher in 4-bit NF4
#                (~4.5 GB VRAM) + Qwen3-0.6B draft. Do NOT use P100 (sm_60 —
#                incompatible with PyTorch 2.10+cu128). T4 x2 is the only working
#                GPU option on Kaggle (no single T4 available). Burns 2× quota
#                (~15 effective h/wk from 30 GPU-h/wk budget).
#
# EXPECTED RUN : flat loss (forward_kl): ~1.0-1.5 h / 1000 steps on T4.
#                tree loss:              ~1.5-2.5 h / 1000 steps (3 model passes
#                                        + K-path tree). Both fit ONE ~9 h session
#                                        with large headroom; raise --train_steps
#                                        if a session has spare time.
#
# PRODUCES     : ckpt_latest / ckpt_best LoRA adapters, the merged model, the
#                train_curves rows (step, loss, accept_weight, split — incl. the
#                in-training val_loss) AND a LIGHT BE sanity row in results.db
#                (block_eff / alpha under ONE matched verifier, K=3, T=1.0, n=100).
#                NOT produced here: the multi-verifier / multi-K / n=1319 sweep,
#                multi-dataset generalization, or the baseline-eval row.
#
# DOES NOT     : Run the heavy eval — no full verifier matrix, no K=5, no n=1319,
#                no humaneval/math500/mtbench/alpaca, no baseline eval. Those are
#                deferred to eval_after_train.yaml / the A100 confirmation.
#
# LIGHT EVAL   : The single sanity verifier is `bv` (the cheap, universal non-OT
#                reference for the flat forward_kl default). For TREE losses the
#                pipeline forces the tree-matched non-OT subset (bv,gbv,traversal)
#                for any *_tree eval step regardless of this profile — that 3-verifier
#                subset is the tree "matched verifier" sanity and is still light vs
#                the full 8-verifier x K{3,5} x n=1319 sweep.
#
# LOSS SELECTION (IMPORTANT):
#   Defaults to forward_kl (the LOCKED priority-1 baseline — train this FIRST).
#   Override to train any single other loss by passing --losses on the CLI:
#     --losses kl_tree     (priority-2 tree baseline)
#     --losses gbv_tree    ("this work" verifier-aligned tree loss)
#   --losses ALWAYS wins over the YAML default below. Pass exactly ONE loss — the
#   profile is single-purpose by design (run it once per loss).
#
# USAGE (run from gbv-research/ on Kaggle):
#   # FIRST, always smoke:
#   python orchestration/experiment.py --config profiles/smoke --smoke --yes \
#     --storage_root /kaggle/working/specdist
#
#   # Phase-1 baseline (forward_kl, the default) — train + light BE sanity:
#   python orchestration/experiment.py --config profiles/train_one_loss --yes \
#     --skip_existing --storage_root /kaggle/working/specdist --experiment_tag wk2_forward_kl
#
#   # Train a different single loss (+ light sanity):
#   python orchestration/experiment.py --config profiles/train_one_loss --yes \
#     --losses kl_tree --skip_existing --storage_root /kaggle/working/specdist --experiment_tag wk3_kl_tree
#
#   # Pure training burn (NO eval at all) — opt out of the light sanity:
#   python orchestration/experiment.py --config profiles/train_one_loss --yes \
#     --train_only --losses forward_kl --storage_root /kaggle/working/specdist
#
#   # Resume after a crash (skips finished steps automatically):
#   python orchestration/experiment.py --config profiles/train_one_loss --yes \
#     --skip_existing --storage_root /kaggle/working/specdist --from train_kl_gsm8k
#
# RESUME/BACKUP: /kaggle/working is ephemeral. Always pass --storage_root, mirror
#               checkpoints + results.db to a Kaggle Dataset at session end
#               (Cell 2b), and re-attach that dataset before Cell 1 next session.

hardware:
  device: cuda
  load_in_4bit: true            # Qwen3-8B NF4 — works on Kaggle (29 GB system RAM)
  compile: false                # torch.compile unreliable in Kaggle kernels

models:
  family: qwen
  draft:  Qwen/Qwen3-0.6B
  target: Qwen/Qwen3-8B         # 4-bit NF4 ~4.5 GB VRAM; same teacher as a100 config

training:
  steps: 1000                   # one session = 1000 steps (kaggle.yaml proven budget)
  lr: 3.0e-5
  warmup_steps: 100             # linear warmup then decay — prevents val-loss bounce
  grad_accum: 16                # effective batch 16 (DistillSpec convention); free VRAM-wise
  lora_r: 8
  lora_alpha: 16
  max_new_tokens: 96
  teacher_temperature: 0.8
  seed: 42                       # 1 seed for free-tier exploration (direction only)
  # Regularization
  grad_clip: 1.0                 # gradient clipping max norm
  lora_dropout: 0.05             # LoRA dropout (0 = no dropout)
  # Loss-specific hyperparameters (only used when the named loss is active)
  ebe_kl_weight: 0.1             # EBE loss: weight for the KL regularization term
  jsd_alpha: 0.5                 # JSD loss: interpolation weight (0=forward KL, 1=reverse KL)

dataset:
  train: core/datasets/raw/gsm8k_train.jsonl
  eval:  core/datasets/raw/gsm8k_30.jsonl   # reference only — NOT used (train_only)

tree_training:
  tree_K: 4                     # <=4 for gbv_tree numerical stability (q_skew)
  tree_L: 8                     # matches the L used at eval time (eval_after_train)

checkpointing:
  save_every: 25                # ~1-2 min cadence — crash-safe on ephemeral Kaggle disk
  milestone_every: 100
  max_checkpoints: 5
  storage_root: /kaggle/working/specdist

logging:
  log_every: 10
  wandb_project: distillspec
  wandb_group: kaggle-t4x2-train1
  run_label: "8B-T4x2-train1"

health:
  val_every: 50                 # val-loss curve (forward-KL proxy for tree losses)
  ppl_check_every: 100
  ppl_threshold: 1.25
  nan_action: skip              # skip NaN batches — Kaggle sessions are precious
  early_stop_patience: 5

# ── LIGHT BE sanity eval ─────────────────────────────────────────────────────
# The cheapest useful sanity: ONE verifier, K=3, T=1.0, n=100, GSM8K only.
# experiment.light_eval (below) drops the baseline eval + the Phase-4 multi-dataset
# sweep, so only this single GSM8K post-train eval runs (~20-30 min). The heavy
# full sweep (all verifiers, K in {3,5}, n=1319, multi-dataset, multi-seed) is
# deferred to eval_after_train.yaml / the A100 confirmation.
# NOTE: for flat losses (the forward_kl default) `bv` is used. For *_tree losses
# the pipeline forces the tree-matched non-OT subset (bv,gbv,traversal) regardless
# of this list — still light vs the full matrix.
evaluation:
  modes: [bv]                   # single cheap matched verifier for the flat default
  K_values: [3]                 # K=3 only (K=5 is reserved for the A100 confirmation)
  teacher_temps: [1.0]           # T=1.0 — DistillSpec/EAGLE paper standard
  L: 8                          # must match tree_training.tree_L
  n_prompts: 100                # free-tier sanity size (full 1319 is A100-only)

experiment:
  light_eval: true              # train + merge + ONE light GSM8K eval; drop baseline + Phase-4
  losses: [kl]                  # default = forward_kl (priority-1). Override via --losses.
  # light_eval_verifier: bv     # optional: override matched verifier for ALL active losses.
  #                             # Default (when absent): each loss uses its natural match
  #                             # from _LOSS_LIGHT_VERIFIER (bv for flat losses, paired
  #                             # verifier for tree losses — e.g. gbv for gbv_tree).
  #                             # Set to a single verifier name (e.g. "bv", "gbv") to force
  #                             # that verifier regardless of which loss is being evaluated.
  # For a deliberate pure-training burn with NO eval, pass --train_only on the CLI
  # (or set train_only: true here instead of light_eval). The two modes are
  # mutually exclusive — pass exactly one.
