# Profile: tree_variant_week — ONE surviving tree-loss variant/week (train + light BE)
# =============================================================================
# PURPOSE      : The weekly tree-loss workflow (Priority-2, RQ2). The tree-loss
#                family has many candidates (kl_tree, rev_kl_tree, jsd_tree,
#                bv_tree, gbv_tree, traversal_tree, ...). On a ~30 GPU-h/week
#                Kaggle budget you CANNOT train them all every week. So each week
#                you train EXACTLY ONE surviving variant — the candidate that is
#                still in contention — as a TIERED run (train + val_loss curves +
#                a LIGHT BE sanity), then KEEP the survivor and DROP the losers
#                before the next week. This profile is one such single-variant,
#                single-session run.
#
#                Workflow across weeks (survivor funnel):
#                  Week N   : train variant A (e.g. kl_tree)  -> light sanity -> decision
#                  Week N+1 : train variant B (e.g. gbv_tree) -> light sanity -> decision
#                  ... keep ONLY the variant that beats the forward_kl baseline
#                  direction; kill the rest (frugality rule: never spend a 2nd week
#                  on a loss that did not beat the baseline at n=100).
#
# HARDWARE     : Kaggle T4 x2 (dual GPU, sm_75), Qwen3-8B teacher 4-bit NF4.
#                Do NOT use P100 (sm_60 — incompatible with PyTorch 2.10+cu128).
#                T4 x2 is the only working GPU on Kaggle (no single T4 available).
#                Burns 2× quota (~15 effective h/wk from 30 GPU-h/wk budget).
#
# EXPECTED RUN : ~1.5-2.5 h / 1000 steps for a tree loss on T4 (3 model passes +
#                K-path tree per step) + ~20-40 min light eval. Fits ONE ~9 h
#                session with headroom.
#
# PRODUCES     : ckpt_latest / ckpt_best + merged model + train_curves rows (incl.
#                the in-training val_loss) for the ONE tree variant, PLUS a LIGHT BE
#                sanity row (K=3, T=1.0, n=100). The val_loss curve is produced
#                inside trainer.py (health.val_every) independent of the BE eval.
#
# LIGHT EVAL   : For *_tree losses the pipeline forces the tree-matched non-OT
#                subset (bv,gbv,traversal) for the eval step regardless of profile
#                modes — this is the tree "matched verifier" sanity. It is still
#                LIGHT vs the full 8-verifier x K{3,5} x n=1319 sweep, which is
#                deferred to eval_after_train.yaml / the A100 confirmation.
#                experiment.light_eval drops the baseline eval + Phase-4 multi-dataset.
#
# DOES NOT     : Run the heavy eval (full verifier matrix, K=5, n=1319, multi-dataset,
#                multi-seed), and does NOT train more than the single variant you pass
#                via --losses.
#                (For a pure-training burn with NO eval, pass --train_only instead.)
#
# VARIANT SELECTION (REQUIRED EACH WEEK):
#   Supply the surviving variant via --losses. Pass exactly ONE tree loss:
#     --losses kl_tree        # on-policy forward-KL (generic tree baseline)
#     --losses gbv_tree       # "this work" — GBV-aligned (q_skew), keep tree_K<=4
#     --losses bv_tree        # block-verification-aligned
#     --losses traversal_tree # traversal-verifier-aligned
#   --losses ALWAYS wins over the YAML default (kl_tree).
#
# USAGE (run from gbv-research/ on Kaggle):
#   # FIRST, smoke-check the exact variant you are about to train:
#   python orchestration/experiment.py --config profiles/smoke --smoke --yes \
#     --losses gbv_tree --storage_root /kaggle/working/specdist
#
#   # This week's surviving variant (train + light BE sanity):
#   python orchestration/experiment.py --config profiles/tree_variant_week --yes \
#     --losses gbv_tree --skip_existing --storage_root /kaggle/working/specdist \
#     --experiment_tag wk4_gbv_tree
#
#   # Pure training burn (NO eval) — opt out of the light sanity:
#   python orchestration/experiment.py --config profiles/tree_variant_week --yes \
#     --train_only --losses gbv_tree --storage_root /kaggle/working/specdist
#
#   # Resume after a crash:
#   python orchestration/experiment.py --config profiles/tree_variant_week --yes \
#     --losses gbv_tree --skip_existing --from train_gbv_tree_gsm8k \
#     --storage_root /kaggle/working/specdist
#
# Later, the HEAVY deferred eval (full matrix, larger n) in its own session:
#   python orchestration/experiment.py --config profiles/eval_after_train --yes \
#     --losses gbv_tree --skip_existing --storage_root /kaggle/working/specdist

hardware:
  device: cuda
  load_in_4bit: true            # Qwen3-8B NF4 — Kaggle (29 GB RAM)
  compile: false

models:
  family: qwen
  draft:  Qwen/Qwen3-0.6B
  target: Qwen/Qwen3-8B

training:
  steps: 1000                   # one session per surviving variant
  lr: 3.0e-5
  warmup_steps: 100
  grad_accum: 16
  lora_r: 8
  lora_alpha: 16
  max_new_tokens: 96
  teacher_temperature: 0.8
  seed: 42                       # 1 seed (direction-only on free tier)

dataset:
  train: core/datasets/raw/gsm8k_train.jsonl
  eval:  core/datasets/raw/gsm8k_30.jsonl

tree_training:
  tree_K: 4                     # <=4 required for gbv_tree numerical stability (q_skew)
  tree_L: 8                     # match eval-time L (eval_after_train)

checkpointing:
  save_every: 25                # crash-safe cadence on ephemeral Kaggle disk
  milestone_every: 100
  max_checkpoints: 5
  storage_root: /kaggle/working/specdist

logging:
  log_every: 10
  wandb_project: distillspec
  wandb_group: kaggle-t4x2-tree-week
  run_label: "8B-T4x2-treewk"

health:
  val_every: 50
  ppl_check_every: 100
  ppl_threshold: 1.25
  nan_action: skip
  early_stop_patience: 5

# ── LIGHT BE sanity eval ─────────────────────────────────────────────────────
# Light sanity at K=3, T=1.0, n=100. For *_tree losses the pipeline forces the
# tree-matched non-OT subset (bv,gbv,traversal) for the eval step regardless of
# the modes listed here — that subset IS the tree "matched verifier" sanity, and
# is still light vs the full 8-verifier x K{3,5} x n=1319 sweep (deferred to
# eval_after_train.yaml / A100). The modes below apply only to any flat-loss eval.
evaluation:
  modes: [bv, gbv, traversal]   # tree-matched non-OT subset (forced for *_tree anyway)
  K_values: [3]                 # K=3 only (K=5 reserved for the A100 confirmation)
  teacher_temps: [1.0]           # T=1.0 — paper standard
  L: 8                          # must match tree_training.tree_L
  n_prompts: 100                # free-tier sanity size (full 1319 is A100-only)

experiment:
  light_eval: true              # train + merge + ONE light GSM8K eval; drop baseline + Phase-4
  losses: [kl_tree]             # default surviving variant; override via --losses each week
  # light_eval_verifier: bv     # optional: override matched verifier for ALL active losses.
  #                             # Default (when absent): each tree loss uses its naturally
  #                             # paired verifier from _LOSS_LIGHT_VERIFIER (e.g. gbv for
  #                             # gbv_tree, traversal for traversal_tree, bv for kl_tree).
  #                             # Set to a single verifier name to force all losses to use it.
  # For a pure-training burn with NO eval, pass --train_only instead (mutually
  # exclusive with light_eval — pick exactly one).
