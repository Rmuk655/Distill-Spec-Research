# Profile: a100_baseline_losses — A100 paper runs for well-known distillation objectives
#
# Purpose: Establish the baseline floor for all standard distillation losses
#          (KL divergence, JSD, L1/total-variation, online KL) on the full
#          Qwen3-0.6B → Qwen3-8B teacher-student pair.
#          These are the comparison anchors for every novel loss we evaluate.
#
# Run order in the 3-profile A100 workflow:
#   Step 1 → THIS FILE    (train baseline losses; produces checkpoints + eval numbers)
#   Step 2 → a100_verifier_sweep.yaml  (eval-only; deep verifier comparison on step-1 checkpoints)
#   Step 3 → a100_new_loss.yaml        (train new loss; verify against step-1 baselines)
#
# Usage:
#   # Smoke test first (fast crash check on A100 before the 2-3 h run):
#   python orchestration/experiment.py --config profiles/a100_baseline_losses --smoke --yes \
#     --storage_root /content/drive/MyDrive/specdist
#
#   # Full run:
#   python orchestration/experiment.py --config profiles/a100_baseline_losses --yes \
#     --storage_root /content/drive/MyDrive/specdist
#
#   # Second-seed reproducibility:
#   python orchestration/experiment.py --config profiles/a100_baseline_losses --yes \
#     --storage_root /content/drive/MyDrive/specdist/seed123 \
#     --experiment_tag seed123
#   (or copy file, set experiment.seed_override: 123)
#
# What runs:
#   Phase 1 — baseline eval on gsm8k           (always, even smoke)
#   Phase 2 — train + merge: kl, jsd, l1, online
#              smoke: 10 steps / full: 2000 steps
#   Phase 3 — eval all 4 losses on gsm8k       (smoke: n=5 / full: n=50)
#   Phase 4 — eval all 4 losses on humaneval, math500, mtbench, alpaca
#              (skipped in smoke; full run only)
#   Skipped — ebe, rev_kl, online_ebe, ebe_single (rework pending)

hardware:
  device: cuda
  load_in_4bit: false
  compile: true

models:
  family: qwen
  draft:  Qwen/Qwen3-0.6B
  target: Qwen/Qwen3-8B

training:
  steps: 2000
  lr: 3.0e-5
  lora_r: 16
  lora_alpha: 32
  max_new_tokens: 128
  teacher_temperature: 0.8
  seed: 42

dataset:
  train: core/datasets/raw/gsm8k_train.jsonl
  eval:  core/datasets/raw/gsm8k_30.jsonl

checkpointing:
  save_every: 100
  milestone_every: 500
  max_checkpoints: 8
  storage_root: /content/drive/MyDrive/specdist

logging:
  log_every: 10
  wandb_project: distillspec
  wandb_group: colab-a100
  run_label: "8B-A100"

health:
  val_every: 100
  ppl_check_every: 500
  ppl_threshold: 1.25
  nan_action: stop
  early_stop_patience: 5

evaluation:
  modes: [alpha, bv, gbv, traversal, specinfer, naive]
  K_values: [3]                 # K=3 only: single representative value for comparative eval
  temperatures: [1.0]           # T=1.0: DistillSpec/EAGLE paper standard
  L: 8
  n_prompts: 50

# ── Experiment scope ─────────────────────────────────────────────────────────
experiment:
  losses: [kl, jsd, l1, online]   # Standard distillation baselines only.
                                    # EBE/rev_kl/online_ebe suspended (see RUN_LOG.md
                                    # 2026-05-28 research review for rationale).
                                    # Add rev_kl ablation: losses: [kl, jsd, l1, online, rev_kl]
