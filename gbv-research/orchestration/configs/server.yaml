# Server configuration — A100/A10G/3090 GPU
# Qwen3-0.6B draft  →  Qwen3-8B target (16 GB in bfloat16)
# Total VRAM needed: ~18 GB (8B target + 0.6B draft + LoRA overhead)
# Use A100 40 GB or 80 GB.  4-bit teacher for T4 (15 GB).

hardware:
  device: cuda
  load_in_4bit: false          # set true for T4 (15 GB) to fit 8B teacher
  compile: true                # torch.compile gives 10-30% speedup on Linux

models:
  family: qwen
  draft:  Qwen/Qwen3-0.6B     # fine-tune 0.6B to speculate for 8B
  target: Qwen/Qwen3-8B       # frozen teacher

training:
  steps: 5000
  lr: 3.0e-5
  lora_r: 16                   # larger r for bigger model gap
  lora_alpha: 32
  max_new_tokens: 128          # longer sequences for better distillation
  teacher_temperature: 0.8
  online_lr: 3.0e-4             # LR for online adapt (higher than offline distillation LR)
  seed: 42

dataset:
  # These paths are for reference only — pipeline hardcodes core/datasets/raw/ via _data().
  train: core/datasets/raw/gsm8k_train.jsonl   # 7,473 prompts; 6,726 train / 747 val (10% split)
  eval:  core/datasets/raw/gsm8k_30.jsonl       # 30-prompt fixed eval set (block-efficiency only)

checkpointing:
  save_every: 200
  milestone_every: 500
  max_checkpoints: 10
  output_root: db/checkpoints

logging:
  log_every: 10
  wandb_project: distillspec
  wandb_group: server-8b
  # run_label: server uses 8B teacher (same as a100 but longer runs)
  run_label: "8B-server"

health:
  val_every: 100
  ppl_check_every: 500
  ppl_threshold: 1.25
  nan_action: stop
  early_stop_patience: 5

evaluation:
  modes: [alpha, specinfer, traversal, gbv]
  K_values: [1, 3, 5, 8]
  L: 8
  n_prompts: 100               # more prompts for reliable numbers on server

tree_training:
  # K=8 on A100 — more paths per step = stronger on-policy gradient signal.
  # L=8 matches the evaluation block depth so training and eval see the same tree size.
  # NOTE: K > 4 can cause numerical instability in gbv_tree (compute_skew is unstable
  # for large K by design — see otlp_registry.py "not recommended for K > 4").
  # Use gbv_tree with tree_K: 4 even on A100 unless you have verified stability.
  tree_K: 8
  tree_L: 8
