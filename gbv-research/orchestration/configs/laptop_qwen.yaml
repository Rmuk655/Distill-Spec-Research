# laptop.yaml — Qwen toy combo, code verification (RTX 500 Ada, 6 GB VRAM)
# Inherits platform settings from bases/laptop.yaml; adds Qwen2.5-0.5B→Qwen3-0.6B pair.
#
# Hardware (Mukund's machine):
#   GPU0: NVIDIA RTX 500 Ada Generation, 6 GB VRAM
#   RAM:  64 GB DDR5 5600 MT/s
#
# WHY TRENDS ARE IMPOSSIBLE HERE:
#   Teacher (0.6B) ≈ student (0.5B) — zero meaningful distillation gap.
#   Do NOT interpret laptop results as research findings.
#
# PURPOSE: Crash-test every code path before pushing to T4/A100.
#   --smoke:  all losses, 10 steps each, ~25 min  (fast all-code-path check)
#   no flag:  all losses, 100 steps each, ~2-3 hr (full pipeline exerciser)
#
# WHEN TO MOVE TO T4/A100:
#   Both smoke and full pass → promote to Kaggle/Colab for real distillation signal.

_base: bases/laptop   # hardware + eval + health + dataset — see bases/laptop.yaml

models:
  family: qwen
  draft:  Qwen/Qwen2.5-0.5B
  target: Qwen/Qwen3-0.6B

training:
  steps: 100                    # exercises all checkpointing paths; NOT for paper results
  lr: 3.0e-5
  warmup_steps: 10              # 10% of 100 steps (1 optimizer step at grad_accum=4)
  lora_r: 4                     # smallest rank — this run is about code, not capacity
  lora_alpha: 8
  max_new_tokens: 32
  teacher_temperature: 0.8
  online_lr: 3.0e-4
  seed: 42
  grad_clip: 1.0
  lora_dropout: 0.05
  ebe_kl_weight: 0.1
  jsd_alpha: 0.5

logging:
  wandb_group: laptop-gsm8k
  run_label: "0.6B-laptop"

health:
  val_every: 50
  ppl_check_every: 100

checkpointing:
  save_every: 20                # fires 5x in 100 steps — exercises rolling checkpoint logic
  milestone_every: 100

evaluation:
  temperatures: [0.6]

experiment:
  losses: [kl, rev_kl, jsd, l1, ebe, ebe_single,
           kl_tree, rev_kl_tree, jsd_tree,
           bv_tree, gbv_tree, traversal_tree,
           naive_tree, nss_tree, specinfer_tree, spectr_tree, khisti_tree]
  exclude_losses: [online, online_ebe, online_ebe_single, online_kl_tree, online_ebe_tree]
