# W&B hyperparameter sweep configuration for SpecDist distillation experiments.
#
# This file defines the search space for a W&B sweep.  The sweep agent calls
# train_qwen3.py once per trial, varying the parameters below.
#
# Usage:
#   # Register the sweep with W&B and get a sweep ID:
#   python orchestration/run_sweep.py --sweep_config orchestration/configs/sweep.yaml
#
#   # Launch additional parallel agents (each runs on a separate GPU):
#   wandb agent <entity>/<project>/<sweep_id>
#
# Full sweep (all losses × lr values × lora_r):
#   python orchestration/run_sweep.py --count 50
#
# Quick sweep (single loss, small grid):
#   python orchestration/run_sweep.py --count 12 --loss kl
#
# Reference: https://docs.wandb.ai/guides/sweeps/configuration

program: OSD/train_qwen3.py

method: bayes                   # bayes = Bayesian optimization (best for <50 runs)
                                # grid  = exhaustive grid search
                                # random = random sampling

metric:
  name: val/loss                # W&B metric key to optimize
  goal: minimize                # minimize val/loss (lower = better distillation)

parameters:
  # ── Learning rate — most impactful hyperparameter ─────────────────────────
  lr:
    distribution: log_uniform_values
    min: 1e-5
    max: 1e-4

  # ── Loss function ─────────────────────────────────────────────────────────
  # Sweep over all 5 offline distillation losses (online uses separate script).
  loss:
    values: [forward_kl, ebe, reverse_kl, jsd, l1]

  # ── LoRA rank ─────────────────────────────────────────────────────────────
  lora_r:
    values: [4, 8, 16]

  # ── EBE-specific: KL regularizer weight ───────────────────────────────────
  # Only used when loss=ebe.  Ignored by other losses (harmless to pass).
  ebe_kl_weight:
    distribution: log_uniform_values
    min: 0.01
    max: 0.5

  # ── JSD-specific: interpolation alpha ─────────────────────────────────────
  # Only used when loss=jsd.  0=reverse KL, 1=forward KL, 0.5=symmetric JSD.
  jsd_alpha:
    distribution: uniform
    min: 0.1
    max: 0.9

  # ── Teacher temperature ────────────────────────────────────────────────────
  teacher_temp:
    values: [0.6, 0.8, 1.0]

  # ── Gradient clipping ─────────────────────────────────────────────────────
  grad_clip:
    values: [0.5, 1.0, 2.0]

  # ── LoRA dropout ──────────────────────────────────────────────────────────
  lora_dropout:
    values: [0.0, 0.05, 0.1]

  # ── Fixed parameters (same across all sweep runs) ─────────────────────────
  # These are passed as constants so the sweep agent doesn't vary them.
  steps:
    value: 300                  # quick sweep: 300 steps per trial (~15 min on A10G)
  draft:
    value: Qwen/Qwen3-0.6B
  target:
    value: Qwen/Qwen3-8B
  dataset:
    value: OSD/data/gsm8k_train.jsonl
  wandb_group:
    value: hparam_sweep_v1      # all sweep runs appear under this group in W&B UI
  no_wandb:
    value: false
  seed:
    value: 42

# ── Early termination ─────────────────────────────────────────────────────────
# Stop underperforming runs early to save compute (hyperband/median stopping).
early_terminate:
  type: hyperband
  min_iter: 50                  # minimum steps before a run can be killed
  eta: 3                        # aggressiveness: kill bottom 1/3 at each rung
