# Colab configuration -- Google Colab free T4 (15 GB VRAM)
# Draft: Qwen3-0.6B (bf16, ~1.2 GB)   Teacher: Qwen3-4B (bf16, ~8 GB)
#
# Why Qwen3-4B instead of 8B?
#   The 8B teacher needed 4-bit NF4 quantization to fit.  Quantization loads
#   BF16 intermediates into CPU RAM (12 GB on Colab) per-tensor, and the Linux
#   OOM killer fires with SIGKILL before Python can catch anything (exit -9).
#   Qwen3-4B loads as plain BF16: 1.2 + 8.0 + ~1.5 (activations) = ~10.7 GB
#   VRAM -- fits T4 with 4+ GB to spare, no quantization, no CPU RAM spike.
#
# VRAM budget:   draft 1.2 GB + teacher 8.0 GB + KV/activations 1.5 GB = 10.7 GB
# System RAM:    minimal (straight BF16 mmap, no intermediate tensors)
# Alpha eval:    both models in VRAM simultaneously -- works fine
#
# CRASH RESUME: training auto-resumes from ckpt_latest on session restart.
# save_every=25 steps ~= 1-2 min on T4 -- worst-case loss on crash.
#
# To use Qwen3-1.7B teacher instead (even smaller, 6.1 GB total VRAM):
#   models.target: Qwen/Qwen3-1.7B
#   training.max_new_tokens: 128  (lots of headroom)
#
# Use with: python orchestration/experiment.py --config colab --storage_root /content/drive/MyDrive/specdist

hardware:
  device: cuda
  load_in_4bit: false           # not needed -- 4B teacher fits T4 in bfloat16
  compile: false                # torch.compile not reliable in Colab environment

models:
  family: qwen
  draft:  Qwen/Qwen3-0.6B
  target: Qwen/Qwen3-4B         # 8 GB bf16; total VRAM with draft ~10.7 GB -- fits T4

training:
  steps: 500                    # ~2 hrs on T4; use 1000 with Pro
  lr: 3.0e-5
  warmup_steps: 50              # linear warmup 50 steps (10% of 500) → linear decay to 0
                                # (DistillSpec/EAGLE convention — prevents val-loss bounce after step 150)
  grad_accum: 16                # effective batch 16 (matches DistillSpec paper); zero VRAM cost vs 4
  lora_r: 8                     # keep small to stay within T4 VRAM
  lora_alpha: 16
  max_new_tokens: 96            # more headroom with 4B teacher vs 8B
  teacher_temperature: 0.8
  seed: 42

dataset:
  # These paths are for reference only — pipeline hardcodes core/datasets/raw/ via _data().
  train: core/datasets/raw/gsm8k_train.jsonl   # 7,473 prompts; 6,726 train / 747 val (10% split)
  eval:  core/datasets/raw/gsm8k_30.jsonl       # 30-prompt fixed eval set (block-efficiency only)

checkpointing:
  save_every: 25                # save every 25 steps (~1-2 min on T4) -- Colab sessions die without warning
  milestone_every: 100          # permanent snapshots every 100 steps; roll back if loss diverges
  max_checkpoints: 5            # keep last 5 rolling + all milestones
  # storage_root moves ALL persistent artifacts (checkpoints, results.db, logs,
  # pipeline state) to Google Drive so nothing is lost on session crash.
  # Override with --storage_root on the CLI if you mount Drive at a different path.
  storage_root: /content/drive/MyDrive/specdist

logging:
  log_every: 10
  wandb_project: distillspec
  wandb_group: colab-t4
  # run_label is prepended to every W&B run name: "4B-T4-kl_qwen_500steps"
  run_label: "4B-T4"

health:
  val_every: 50
  ppl_check_every: 100
  ppl_threshold: 1.25
  nan_action: skip              # skip instead of stop (T4 sessions are precious)
  early_stop_patience: 5

evaluation:
  # Free-tier compute reduction: single K and single temperature only.
  # All 6 verifier modes kept: laptop data is toy-scale and cannot rank verifiers reliably.
  # alpha kept: BF16 Colab has no 4-bit OOM risk; both models fit in VRAM simultaneously.
  # K=3 only: saves half the eval time; K sweep is not needed for comparative evaluation.
  # T=1.0: DistillSpec/EAGLE/Medusa paper standard (T=0.6 sharpens distributions, changing
  #   acceptance probabilities and making comparison to published numbers unfair).
  # T4 compute budget: train all 17 losses but eval against 6 verifiers only.
  # (A100 expands to 9 — see a100.yaml — for the full alignment matrix.)
  modes: [alpha, bv, gbv, traversal, specinfer, naive]
  K_values: [3]
  temperatures: [1.0]           # T=1.0: DistillSpec/EAGLE/Medusa paper standard for fair comparison
  L: 8
  n_prompts: 50                 # 50 prompts per dataset — mid-quality results on Colab T4� reliable trend direction on T4

tree_training:
  # K=4 on T4 — safe VRAM budget; each path adds ~L forward steps to the tree pass.
  # gbv_tree is numerically stable at K<=4 (see otlp_registry.py compute_skew note).
  tree_K: 4
  tree_L: 8

experiment:
  # T4 trains the full 17-loss family — same as A100 — so paper-quality results
  # can be reproduced on Kaggle/Colab T4 with degraded compute (smaller teacher,
  # fewer steps, fewer eval prompts).  The 8×8 verifier cross-pair runs on A100.
  losses: [kl, rev_kl, jsd, l1, ebe, ebe_single,
           kl_tree, rev_kl_tree, jsd_tree,
           bv_tree, gbv_tree, traversal_tree,
           naive_tree, nss_tree, specinfer_tree, spectr_tree, khisti_tree]
