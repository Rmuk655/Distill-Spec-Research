# a10_qwen.yaml — Qwen3-0.6B → Qwen3-8B BF16, NVIDIA A10 (24 GB VRAM)
#
# Key A10 advantage: Qwen3-8B fits in full BF16 (16 GB) — no quantization.
# This gives the same teacher quality as A100 at lower cost.
#
# VRAM budget:
#   Qwen3-0.6B draft  BF16  : 1.2 GB
#   Qwen3-8B   target BF16  : 16.0 GB
#   LoRA + optimizer state  : 0.2 GB
#   Activations (seq 96)    : 2-3 GB
#   Tree KV cache (K=4,L=8) : 1-2 GB
#   Total                   : ~21-23 GB  → fits 24 GB ✅
#
# vs T4 (16 GB): must use Qwen3-8B NF4 (4-bit, ~4.5 GB)
#    → A10 gives exact same teacher quality as A100 (no quantization rounding)
#
# Speed: A10 ~3-5x faster than T4 → 2000 steps ≈ 60-100 min
#
# Platforms with A10:
#   - IITH cluster (₹80/GPU-hr) — primary
#   - Lambda Labs A10 (~$0.60/hr)
#   - CoreWeave A10
#
# Usage:
#   python orchestration/experiment.py --config a10_qwen --yes \
#     --storage_root /path/to/persistent/storage

_base: bases/a100   # inherit A100 platform defaults (full eval suite, large val set)

models:
  family: qwen
  draft:  Qwen/Qwen3-0.6B
  target: Qwen/Qwen3-8B       # BF16, no quantization — A10 has enough VRAM

hardware:
  load_in_4bit: false          # BF16: A10 24 GB fits 8B without quantization
  compile: true                # Linux GPU — torch.compile gives 10-20% speedup

training:
  steps: 2000                  # A10 ~3-5x faster than T4: 2000 steps ≈ 60-100 min
                               # = 30% of one epoch on full 7473 prompts
                               # Increase to 5000 for stronger convergence signal
  lr: 3.0e-5
  warmup_steps: 200            # 10% of 2000 steps
  grad_accum: 8                # smaller than A100's 16 — save activation memory
                               # effective batch = 8 prompts per optimizer step
  lora_r: 8                    # r=8 for 8B→0.6B gap (vs r=4 on T4/colab_lite)
  lora_alpha: 16
  max_new_tokens: 96           # slightly less than A100's 128 to keep VRAM safe
  teacher_temperature: 0.8
  seed: 42
  grad_clip: 1.0
  lora_dropout: 0.05
  ebe_kl_weight: 0.1
  jsd_alpha: 0.5

logging:
  wandb_group: a10-qwen
  run_label: "8B-a10"

health:
  val_every: 200               # less frequent than A100 (save time; A10 val is slower)
  ppl_check_every: 500

checkpointing:
  save_every: 100
  milestone_every: 500
  max_checkpoints: 8

tree_training:
  tree_K: 4
  tree_L: 8

experiment:
  pipeline_ordering: per_loss
  losses: [kl, rev_kl, jsd, l1, ebe, ebe_single,
           kl_tree, rev_kl_tree, jsd_tree,
           bv_tree, gbv_tree, traversal_tree,
           naive_tree, nss_tree, specinfer_tree, spectr_tree, khisti_tree]
