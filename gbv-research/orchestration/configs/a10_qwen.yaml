# a10_qwen.yaml — Qwen3-0.6B → Qwen3-8B BF16, NVIDIA A10 (24 GB VRAM)
#
# Key A10 advantage: Qwen3-8B fits in full BF16 (16 GB) — no quantization needed.
# BF16 vs NF4: same convergence DIRECTION, ~5-10% cleaner gradients (less
# rounding noise in teacher logits). Kaggle NF4 trends still transfer here.
# Main win: 3-5x faster than T4 + exact teacher distribution.
#
# VRAM budget:
#   Qwen3-0.6B draft  BF16        : 1.2 GB
#   Qwen3-8B   target BF16        : 16.0 GB
#   LoRA r=8 + Adam optimizer     : 0.2 GB
#   Activations (seq 96, batch 1) : 2-3 GB
#   Tree KV cache (K=4, L=8)      : 1-2 GB
#   Total                         : ~21-23 GB  → fits A10 24 GB ✅
#
# Steps formula for visible trends:
#   gsm8k_train has 7473 prompts → val_split=0.1 → 6726 training
#   1 epoch = 6726 gradient steps
#   Visible trend target = 0.15 epoch (8B teacher signal is strong)
#                        = 6726 × 0.15 ≈ 1000 steps ← chosen
#
#   Why 0.15 epoch is enough with 8B teacher:
#     - 8B→0.6B gap (13×) gives large KL gradient per step (~0.5-1 nat)
#     - EMA loss smoothing makes trend visible in ~200-300 optimizer steps
#     - With grad_accum=8: 1000 grad-steps = 125 optimizer steps → trend clear
#
#   Time at ~2-3 s/step (A10 estimate):
#     1000 steps × 2.5 s = ~42 min ← initial trend run (this config)
#     2000 steps × 2.5 s = ~83 min ← stronger convergence signal if time allows
#
# Usage:
#   python orchestration/experiment.py --config a10_qwen --yes \
#     --storage_root /path/to/persistent/storage

_base: bases/a100   # inherit A100 platform defaults (full eval suite, large val set)

models:
  family: qwen
  draft:  Qwen/Qwen3-0.6B
  target: Qwen/Qwen3-8B       # BF16 — A10 24 GB fits 8B without quantization

hardware:
  load_in_4bit: false          # BF16: exact teacher logits, no NF4 rounding noise
  compile: true                # Linux GPU — torch.compile gives 10-20% speedup

training:
  # 1000 steps = 15% of 1 epoch on full 7473 prompts.
  # With 8B teacher (13× size gap, strong signal) this shows clear loss trend.
  # Run with --steps 2000 for stronger convergence confirmation if session allows.
  steps: 1000
  lr: 3.0e-5
  warmup_steps: 100            # 10% of 1000 steps (50 grad-steps = ~12 optimizer steps)
  grad_accum: 8                # 8 prompts per optimizer step → 125 optimizer steps total
                               # smoother gradients than grad_accum=4 without extra VRAM
  lora_r: 8                    # r=8 for the 13× teacher gap (vs r=4 for 2.8× 1.7B gap)
  lora_alpha: 16
  max_new_tokens: 96           # slightly less than A100's 128 to stay safe in 24 GB
  teacher_temperature: 0.8
  seed: 42
  grad_clip: 1.0
  lora_dropout: 0.05
  ebe_kl_weight: 0.1
  jsd_alpha: 0.5

logging:
  wandb_group: a10-qwen
  run_label: "8B-a10"

health:
  val_every: 100               # every 100 steps → 10 val checks over 1000 steps
  ppl_check_every: 500

checkpointing:
  save_every: 100
  milestone_every: 500
  max_checkpoints: 8

tree_training:
  tree_K: 4
  tree_L: 8

evaluation:
  # Exploration-grade eval: single K and temperature (save time for more training runs)
  # Expand to full sweep once a loss shows promise.
  modes: [alpha, bv, gbv, traversal, specinfer, naive]
  K_values: [3]
  temperatures: [1.0]
  n_prompts: 50               # 50 prompts — trend direction; A100 uses 1319 for paper

experiment:
  pipeline_ordering: per_loss
  losses: [kl, rev_kl, jsd, l1, ebe, ebe_single,
           kl_tree, rev_kl_tree, jsd_tree,
           bv_tree, gbv_tree, traversal_tree,
           naive_tree, nss_tree, specinfer_tree, spectr_tree, khisti_tree]
