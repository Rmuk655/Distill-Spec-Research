# Kaggle T4 x2 configuration — dual GPU (sm_75), Qwen3-8B teacher in 4-bit NF4
#
# GPU options on Kaggle: P100 (sm_60, BROKEN) · T4 x2 (sm_75, the only viable option) · TPU (unused)
# P100 is incompatible with PyTorch 2.10+cu128 (requires sm_70+). Always select T4 x2.
# T4 x2 burns 2× the weekly quota: 30 GPU-h/wk → ~15 effective session-hours.
#
# Why this config exists separately from colab.yaml (T4 / 4B BF16):
# -------------------------------------------------------------------
# Kaggle T4 x2 (2×16 GB VRAM) and Colab T4 (1×16 GB) differ in system RAM hugely:
#
#   Colab free tier:  ~12 GB system RAM
#   Kaggle free tier: ~29 GB system RAM
#
# 4-bit NF4 quantization (bitsandbytes) loads each weight tensor as BF16 into
# CPU RAM first, then converts to NF4.  For Qwen3-8B: ~16 GB RAM intermediates.
#
#   Colab:  12 GB RAM < 16 GB needed → Linux OOM kills the process (SIGKILL).
#           No exception raised — Python cannot catch it.  This is why colab.yaml
#           uses the 4B teacher in plain BF16 instead.
#
#   Kaggle: 29 GB RAM > 16 GB needed → NF4 loading succeeds.
#           Use the 8B teacher, same signal quality as the A100 config.
#
# VRAM budget (T4 x2, 2×16 GB — device_map="auto" splits teacher across both GPUs):
#   Teacher Qwen3-8B in 4-bit NF4: ~4.5 GB total (split across GPU 0 + GPU 1)
#   Draft   Qwen3-0.6B in BF16:     1.2 GB (GPU 0)
#   LoRA adapters + optimizer:       0.1 GB (GPU 0)
#   Activations / KV cache (seq 96): 2.0 GB (GPU 0)
#   Total on GPU 0:                 ~7.8 GB — 8+ GB headroom on each 16 GB GPU
#
#   device_map="auto" automatically splits the 8B NF4 teacher across both T4 GPUs,
#   freeing even more VRAM on GPU 0 (training GPU). No code changes needed — just
#   select T4 x2 in Kaggle notebook settings; the trainer handles it automatically.
#
# Steps / time on T4:
#   500 steps  ≈ 2-4 h (colab config level, same teacher quality as A100)
#   1000 steps ≈ 4-8 h (Kaggle 9-hour sessions can do this comfortably)
#
# Use with:
#   python orchestration/experiment.py \
#     --config kaggle --storage_root /kaggle/working/specdist --yes

hardware:
  device: cuda
  hw_tier: colab           # hardware tier (laptop/cpu/colab/a100) — not the notebook platform
  load_in_4bit: true            # 8B NF4 — works on Kaggle (29 GB RAM), not on Colab (12 GB RAM)
  compile: false                # torch.compile not reliable in Kaggle/Colab kernel environments

models:
  family: qwen
  draft:  Qwen/Qwen3-0.6B
  target: Qwen/Qwen3-8B         # 4-bit NF4 ~4.5 GB VRAM — same teacher as A100 config

training:
  steps: 1000                   # 9-hour Kaggle sessions can comfortably run 1000 steps
  lr: 3.0e-5
  warmup_steps: 100             # linear warmup 100 steps → linear decay to 0 by step 1000
                                # (DistillSpec/EAGLE convention — prevents val-loss bounce after step 150)
  grad_accum: 16                # effective batch 16 (matches DistillSpec paper); zero VRAM cost vs 4
  lora_r: 8                     # same as colab.yaml — conservative for T4 VRAM
  lora_alpha: 16
  max_new_tokens: 96
  teacher_temperature: 0.8
  seed: 42
  # Regularization
  grad_clip: 1.0                 # gradient clipping max norm
  lora_dropout: 0.05             # LoRA dropout (0 = no dropout)
  # Loss-specific hyperparameters (only used when the named loss is active)
  ebe_kl_weight: 0.1             # EBE loss: weight for the KL regularization term
  jsd_alpha: 0.5                 # JSD loss: interpolation weight (0=forward KL, 1=reverse KL)
  # T4 exploration: 2 epochs over 500 diverse prompts.
  # 1000 steps / 500 prompts = 2 epochs with 8B NF4 teacher → clear trend.
  # 8B teacher signal is strong enough that 2 epochs reliably ranks losses.
  # Without this: 1000/7473 = 13% of 1 epoch → marginal trend visibility.
  max_train_prompts: 500

dataset:
  train: core/datasets/raw/gsm8k_train.jsonl
  eval:  core/datasets/raw/gsm8k_10.jsonl
  # val_dataset: filename passed to trainer.py --val_dataset to bound validation cost.
  # Without this, trainer uses val_split=0.1 → 10% of 6726 = 672 prompts → ~23 min/check.
  # gsm8k_10.jsonl → ~3 min/check; gsm8k_30.jsonl → ~23 min/check.
  val_dataset: gsm8k_10.jsonl

checkpointing:
  save_every: 25                # save every 25 steps (~1-2 min on T4)
  milestone_every: 100
  max_checkpoints: 5
  # /kaggle/working/ is ephemeral — pipeline writes to STORAGE_ROOT passed on CLI.
  # On Kaggle: --storage_root /kaggle/working/specdist
  storage_root: /kaggle/working/specdist

logging:
  log_every: 10
  wandb_project: distillspec
  wandb_group: kaggle-t4
  # "8B-kaggle" prefix distinguishes these runs from colab (4B) and A100 (8B BF16)
  run_label: "8B-kaggle"

health:
  val_every: 200          # 5 val checks over 1000 steps (was 50 → 20 checks, ~7.7 h wasted)
                          # Each val check costs ~20-25 min on T4 with 4-bit 8B teacher
  ppl_check_every: 200
  ppl_threshold: 1.25
  nan_action: skip              # skip NaN batches (Kaggle sessions are precious)
  early_stop_patience: 5

evaluation:
  # Free-tier compute reduction: single K and single temperature only.
  # alpha excluded: OOM with 4-bit (both models in VRAM simultaneously > 29 GB system RAM).
  #   See experiment.py load_in_4bit alpha exclusion note.
  # specinfer and naive kept: laptop data is toy-scale (300 steps, 10 prompts) and cannot
  #   reliably rank verifiers — all modes run so no information is discarded pre-paper.
  # K=3 only: saves half the eval time; K sweep is not needed for comparative evaluation.
  # T=1.0: DistillSpec/EAGLE/Medusa paper standard (T=0.6 sharpens distributions, changing
  #   acceptance probabilities and making comparison to published numbers unfair).
  modes: [bv, gbv, traversal, specinfer, naive]
  exclude_modes_when_4bit: [alpha]   # redundant with modes list; documents 4-bit safety rule
  K_values: [3]
  teacher_temps: [1.0]           # T=1.0: DistillSpec/EAGLE/Medusa paper standard for fair comparison
  L: 8
  n_prompts: 100                # 100 prompts per dataset — paper-quality results on Kaggle T4� reliable trend direction on T4

tree_training:
  tree_K: 4
  tree_L: 8

experiment:
  # ebe + ebe_single: re-enabled after fixing kl_weight (was 0.1 → now 1.0).
  #   Root cause of -0.202 delta: KL at 10% weight gave 10x weaker training than
  #   standalone KL.  Formula and gradient direction were correct.
  # online + online_ebe: still disabled — _draft_propose greedy sampling bug
  #   fixed (now uses temperature sampling), but need a clean run to verify.
  #   The online EBE buffer also needs redesign (see online_serve.py L197-228).
  #   Re-enable online/online_ebe after a smoke run confirms no divergence.
  # Full 17-loss family — same as A100 — for Kaggle's 9-hour session budget.
  # New verifier-aligned tree losses (naive/nss/specinfer/spectr/khisti) added
  # 2026-05; see tree_losses.py for the math and α formulas.
  # ebe / ebe_single removed: off-policy flat losses, not the paper contribution.
  losses: [kl, rev_kl, jsd, l1,
           kl_tree, rev_kl_tree, jsd_tree,
           bv_tree, gbv_tree, traversal_tree,
           naive_tree, nss_tree, specinfer_tree, spectr_tree, khisti_tree]
  # Exclude online OSD variants and off-policy EBE flat losses.
  exclude_losses: [ebe, ebe_single,
                   online, online_ebe, online_ebe_single, online_kl_tree, online_ebe_tree]
