# Laptop configuration — code verification only (no trend detection)
# Hardware: RTX 500 Ada, 6 GB VRAM
# Draft: Qwen2.5-0.5B (0.5B, ~1 GB BF16)   Teacher: Qwen3-0.6B (0.6B, ~1.2 GB BF16)
# Total VRAM: ~3 GB.  No 4-bit quantization needed.
#
# WHY TRENDS ARE IMPOSSIBLE HERE:
#   The teacher (0.6B) is the same size class as the draft (0.5B).
#   Distillation signal from a model barely larger than the student is
#   essentially noise.  Do not interpret laptop results as research findings.
#
# PURPOSE: Verify that every code path runs without crashing:
#   train loop → checkpoint save/load cycle → merge → all eval modes
#   Use --smoke for a fast crash test (~8-15 min, 10 steps).
#   Run without --smoke to exercise ALL paths (~60-75 min, 200 steps).
#   Only kl (flat loss) + kl_tree (tree loss) run — one representative per family.
#   All other losses share the same code path; running all 17 would take 4+ hours.
#
# TWO-STAGE LAPTOP GATE:
#   1. python orchestration/experiment.py --config laptop --smoke --yes
#      Fast crash detector.  Should complete ~8-15 min.
#      Gate: no exceptions, losses are finite numbers.
#   2. python orchestration/experiment.py --config laptop --yes
#      Full code-path exerciser.  Should complete ~60-75 min.
#      kl + kl_tree losses, K=3, T=0.6, n=5 -- no parameter sweep.
#      Gate: all eval modes produce output, checkpoint resume works,
#      merge completes, W&B run appears in wandb.ai.
#      (Block efficiency numbers from this run are meaningless -- ignore them.)
#
# WHEN TO MOVE TO T4 (Kaggle/Modal):
#   Both gates pass AND you want to assess whether a new loss function or
#   verifier implementation actually helps.  T4 uses Qwen3-8B NF4
#   teacher → real distillation signal → real trends.

hardware:
  device: cuda
  load_in_4bit: false
  compile: false               # torch.compile has limited support on Windows

models:
  family: qwen
  draft:  Qwen/Qwen2.5-0.5B
  target: Qwen/Qwen3-0.6B

training:
  steps: 200                    # 4× smoke (50), enough to see loss curves fall; NOT for paper
  lr: 3.0e-5
  lora_r: 4                     # smallest rank -- this run is about code, not capacity
  lora_alpha: 8
  max_new_tokens: 32            # keep inference fast; we're not measuring quality
  teacher_temperature: 0.8
  online_lr: 3.0e-4             # LR for online adapt (higher than offline distillation LR)
  seed: 42
  # Regularization
  grad_clip: 1.0                 # gradient clipping max norm
  lora_dropout: 0.05             # LoRA dropout (0 = no dropout)
  # Loss-specific hyperparameters (only used when the named loss is active)
  ebe_kl_weight: 0.1             # EBE loss: weight for the KL regularization term
  jsd_alpha: 0.5                 # JSD loss: interpolation weight (0=forward KL, 1=reverse KL)

dataset:
  train: core/datasets/raw/gsm8k_train.jsonl
  eval:  core/datasets/raw/gsm8k_5.jsonl
  # val_dataset: fixed 5-prompt val set passed to trainer.py --val_dataset.
  # Without this, trainer uses val_split=0.1 → last 10% of 6726 = 672 prompts → very slow.
  # Same 5 prompts every run (deterministic) — consistent signal, fast (~30 s on laptop).
  val_dataset: gsm8k_5.jsonl

checkpointing:
  save_every: 20                # fires 10x in 200 steps -- exercises rolling checkpoint logic
  milestone_every: 100          # fires 2x in 200 steps -- exercises permanent checkpoint logic
  max_checkpoints: 3
  output_root: db/checkpoints

logging:
  log_every: 10
  wandb_project: distillspec
  wandb_group: laptop-gsm8k
  # run_label: laptop uses 0.6B as both draft and teacher (sanity/debug only)
  run_label: "0.6B-laptop"

health:
  val_every: 50                 # fires 4x in 200 steps -- exercises validation path
  ppl_check_every: 100          # fires 2x in 200 steps -- exercises ppl health check
  ppl_threshold: 1.25
  nan_action: stop
  early_stop_patience: 3

evaluation:
  # Single K, single temperature, single n -- laptop run is a code exerciser, not a sweep.
  # All 6 verifier modes still run to verify every evaluator path.
  # Numbers produced are meaningless (0.6B teacher) -- only check for no crashes and finite BE.
  modes: [alpha, bv, gbv, traversal, specinfer, naive]
  K_values: [3]                 # single K -- no parameter sweep on laptop
  temperatures: [0.6]           # single temperature -- no sweep
  L: 8
  # 5 prompts: ~3 min per eval mode, ~18 min total for 6 modes.
  # Smoke uses 3 prompts (overrides this).  10 was the old default but 5 is enough
  # to confirm finite BE and catch shape errors on all code paths.
  n_prompts: 5

tree_training:
  # Hyperparameters for tree-structured distillation losses.
  # Used when experiment.losses includes any of the *_tree losses.
  # tree_K: number of i.i.d. draft paths sampled per training step.
  # tree_L: draft block depth (tokens per path).
  tree_K: 4
  tree_L: 8

experiment:
  # Only 2 representative losses run on laptop:
  #   kl       — one flat loss (exercises the flat-sequence code path)
  #   kl_tree  — one tree loss (exercises the tree-structured code path)
  # All other losses (rev_kl, jsd, l1, ebe, bv_tree, gbv_tree, ...) share the same
  # code paths as kl and kl_tree respectively — running all 17 would take 4+ hours
  # for no additional code coverage.
  # To test a different loss pair: python experiment.py --config laptop --losses kl,ebe --yes
  losses: [kl, kl_tree]
