# laptop_gpt2.yaml — GPT-2 convergence verification (RTX 500 Ada, 6 GB VRAM)
# Inherits platform settings from bases/laptop.yaml; adds distilgpt2→gpt2-medium pair.
#
# Draft:  distilgpt2   (82 M,  ~330 MB)
# Target: gpt2-medium  (355 M, ~1.4 GB)
# vocab_size = 50257 for both — SD requirement satisfied.
#
# Results ARE meaningful: 4.3x model-size gap → real distillation signal.
# Use this when Kaggle/Colab credits are exhausted.
#
# NOTE: ebe and online losses excluded — see docs/ISSUES.md.

_base: bases/laptop   # hardware + eval + health + dataset — see bases/laptop.yaml

models:
  family: gpt2
  draft:  distilgpt2
  target: gpt2-medium

training:
  steps: 500
  lr: 3.0e-5                    # same as Qwen; 1e-4 caused oscillation on math prompts
                                # (high per-prompt KL variance at 4.3x teacher gap)
  lora_r: 8
  lora_alpha: 16
  max_new_tokens: 32
  teacher_temperature: 1.0      # GPT-2 does not pre-scale logits by temperature
  online_lr: 3.0e-4
  seed: 42
  grad_clip: 1.0
  lora_dropout: 0.05
  ebe_kl_weight: 0.1
  jsd_alpha: 0.5
  # Convergence proof: cap training set so each prompt is seen ~5 times.
  # Without this cap: 500 steps / 7473 prompts = 6.7% of one epoch → no trend.
  # With this cap: 500 steps / 100 prompts = 5 epochs → clear monotonic decrease.
  # This is convergence verification only; paper results come from Qwen 8B on T4/A100.
  max_train_prompts: 100

logging:
  wandb_group: laptop-gpt2-gsm8k
  run_label: "gpt2-laptop"

health:
  val_every: 100
  ppl_check_every: 250
  ppl_threshold: 1.5            # GPT-2 base ppl on GSM8K is high; looser threshold

checkpointing:
  save_every: 100
  milestone_every: 500

evaluation:
  temperatures: [1.0]

experiment:
  exclude_losses: [ebe, ebe_single, ebe_tree,
                   online, online_ebe, online_ebe_single, online_kl_tree, online_ebe_tree]
