# laptop_gpt2.yaml — GPT-2 convergence verification (RTX 500 Ada, 6 GB VRAM)
# Inherits platform settings from bases/laptop.yaml; adds distilgpt2→gpt2-medium pair.
#
# Draft:  distilgpt2   (82 M,  ~330 MB)
# Target: gpt2-medium  (355 M, ~1.4 GB)
# vocab_size = 50257 for both — SD requirement satisfied.
#
# Dataset: WikiText-2 (NOT GSM8K — see below)
#
# WHY WikiText-2 instead of GSM8K:
#   Both distilgpt2 and gpt2-medium were trained on WebText (curated Reddit links,
#   general English web text).  GSM8K math is completely out-of-distribution for them.
#   On GSM8K: teacher has high-entropy random distributions → noisy distillation gradient
#   → KL and rev_KL diverge, tree losses appear stable only because they measure acceptance
#   on the student's own paths (which are also random on math text).
#
#   WikiText-2 is Wikipedia prose — same style as WebText, fully in-distribution.
#   On WikiText: both models have meaningful distributions → clean KL convergence,
#   real distillation signal, early trends generalize to larger runs.
#
# Download (one-time, before first run):
#   python core/datasets/download_wikitext.py
#
# Purpose: Prove distillation algorithm converges for GPT-2 family before
#   committing A100 budget to LLaMA 1B→3B (which uses GSM8K, is in-distribution).
#
# NOTE: ebe and online losses excluded — see docs/ISSUES.md.

_base: bases/laptop   # hardware + eval + health — see bases/laptop.yaml

models:
  family: gpt2
  draft:  distilgpt2
  target: gpt2-medium

# Override dataset: use WikiText-2 instead of GSM8K (bases/laptop uses gsm8k)
dataset:
  train: core/datasets/raw/wikitext_train.jsonl
  eval:  core/datasets/raw/wikitext_5.jsonl
  val_dataset: wikitext_5.jsonl      # fast fixed val — Wikipedia prose, in-distribution

training:
  steps: 500
  warmup_steps: 50              # 10% of 500 steps
  lr: 3.0e-5
  lora_r: 8
  lora_alpha: 16
  max_new_tokens: 32
  teacher_temperature: 1.0      # GPT-2 does not pre-scale logits by temperature
  online_lr: 3.0e-4
  seed: 42
  grad_clip: 1.0
  lora_dropout: 0.05
  ebe_kl_weight: 0.1
  jsd_alpha: 0.5
  # 500 steps / 100 prompts = 5 epochs — clear convergence on in-distribution data.
  max_train_prompts: 100

logging:
  wandb_group: laptop-gpt2-wikitext
  run_label: "gpt2-laptop-wiki"

health:
  val_every: 100
  ppl_check_every: 250
  ppl_threshold: 1.5

checkpointing:
  save_every: 100
  milestone_every: 500

evaluation:
  temperatures: [1.0]

experiment:
  exclude_losses: [ebe, ebe_single, ebe_tree,
                   online, online_ebe, online_ebe_single, online_kl_tree, online_ebe_tree]
