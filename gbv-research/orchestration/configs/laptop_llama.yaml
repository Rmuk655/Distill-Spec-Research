# laptop_llama.yaml — LLaMA convergence verification (RTX 500 Ada, 6 GB VRAM)
# Inherits platform settings from bases/laptop.yaml; adds Llama-3.2-1B→3B pair.
#
# Draft:  meta-llama/Llama-3.2-1B-Instruct  (1B,  ~2.0 GB BF16)
# Target: meta-llama/Llama-3.2-3B-Instruct  (3B,  ~1.5 GB NF4 4-bit)
# vocab_size = 128256 for both — SD requirement satisfied.
#
# HuggingFace gated access required:
#   Accept licence at https://huggingface.co/meta-llama/Llama-3.2-1B-Instruct
#   then run:  huggingface-cli login
#
# VRAM: 1B BF16 ~2.0 GB + 3B NF4 ~1.5 GB + LoRA + activations = ~4.6-5.6 GB → fits 6 GB
#
# Results are research-relevant: 3x size gap → genuine distillation signal.
# Same architecture as most SOTA speculative decoding papers.
#
# NOTE: ebe and online losses excluded — see docs/ISSUES.md.

_base: bases/laptop   # hardware + eval + health + dataset — see bases/laptop.yaml

hardware:
  load_in_4bit: true            # 3B target in NF4; draft stays BF16

models:
  family: llama
  draft:  meta-llama/Llama-3.2-1B-Instruct
  target: meta-llama/Llama-3.2-3B-Instruct

training:
  steps: 500
  warmup_steps: 50              # 10% of 500 steps
  lr: 5.0e-5
  lora_r: 8
  lora_alpha: 16
  max_new_tokens: 32
  teacher_temperature: 1.0      # LLaMA does NOT pre-scale logits by temperature
  online_lr: 5.0e-4
  seed: 42
  grad_clip: 1.0
  lora_dropout: 0.05
  ebe_kl_weight: 0.1
  jsd_alpha: 0.5
  max_train_prompts: 100        # 500 steps / 100 prompts = 5 epochs — convergence proof

logging:
  wandb_group: laptop-llama-gsm8k
  run_label: "llama-1B-3B-laptop"

health:
  val_every: 100
  ppl_check_every: 250

checkpointing:
  save_every: 100
  milestone_every: 500

evaluation:
  temperatures: [1.0]

experiment:
  exclude_losses: [ebe, ebe_single, ebe_tree,
                   online, online_ebe, online_ebe_single, online_kl_tree, online_ebe_tree]
