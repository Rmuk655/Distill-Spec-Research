# server_gpt2 — ATS Cloud bare-metal server (CPU only, 128 GB RAM, no GPU)
# Draft:  distilgpt2   (82 M,  ~330 MB)
# Target: gpt2-medium  (355 M, ~1.4 GB)
# Both share vocab_size=50257 — SD requirement satisfied.
#
# PURPOSE: Run all GPT-2 loss variants on the ATS Cloud server when GPU
# credits (Kaggle/Colab) are exhausted.  CPU-only — no CUDA needed.
# Results ARE research-meaningful: 355M teacher >> 82M student (4.3× gap).
#
# RUNNING:
#   Option A — sequential, experiment.py handles everything (simple, ~30-50 hr):
#     python orchestration/experiment.py --config server_gpt2 --yes
#
#   Option B — parallel trainer.py calls (faster, ~4-6 hr for all losses):
#     Run scripts/parallel_train_cpu.sh (or train each loss manually):
#       for loss in kl rev_kl jsd l1 kl_tree rev_kl_tree jsd_tree bv_tree \
#                   gbv_tree traversal_tree naive_tree nss_tree specinfer_tree \
#                   spectr_tree khisti_tree; do
#         python algorithms/distillspec_gbv/trainer.py \
#           --model_family gpt2 --draft distilgpt2 --target gpt2-medium \
#           --loss $loss --steps 1000 --device cpu --no_wandb \
#           --output db/checkpoints/${loss}-gpt2 &
#       done
#       wait  # all 15 run in parallel — 128 GB RAM handles it easily
#
# INTERPRETATION:
#   loss decreasing monotonically    → distillation signal propagating
#   acceptance rate > 0 at step 100  → speculative decoding working
#   your method beats forward_kl BE  → hypothesis supported
#
# NOTE: ebe and online losses excluded (see docs/ISSUES.md).

hardware:
  device: cpu
  load_in_4bit: false
  compile: false

models:
  family: gpt2
  draft:  distilgpt2
  target: gpt2-medium

training:
  steps: 1000                   # 2× laptop_gpt2; clearer convergence curves
  lr: 1.0e-4
  lora_r: 8
  lora_alpha: 16
  max_new_tokens: 32
  teacher_temperature: 1.0      # GPT-2 does not pre-scale logits
  online_lr: 1.0e-3
  seed: 42
  grad_clip: 1.0
  lora_dropout: 0.05
  ebe_kl_weight: 0.1
  jsd_alpha: 0.5

dataset:
  train: core/datasets/raw/gsm8k_train.jsonl
  eval:  core/datasets/raw/gsm8k_5.jsonl
  val_dataset: gsm8k_5.jsonl

checkpointing:
  save_every: 200
  milestone_every: 1000
  max_checkpoints: 3
  output_root: db/checkpoints

logging:
  log_every: 50
  wandb_project: distillspec
  wandb_group: server-gpt2-gsm8k
  run_label: "gpt2-cpu-server"
  no_wandb: true                # CPU server, no W&B overhead

health:
  val_every: 200
  ppl_check_every: 500
  ppl_threshold: 1.5
  nan_action: stop
  early_stop_patience: 3

evaluation:
  modes: [alpha, bv, gbv, traversal, specinfer, naive]
  K_values: [3]
  temperatures: [1.0]
  L: 8
  n_prompts: 5

tree_training:
  tree_K: 4
  tree_L: 8

experiment:
  losses: [kl, rev_kl, jsd, l1,
           kl_tree, rev_kl_tree, jsd_tree,
           bv_tree, gbv_tree, traversal_tree,
           naive_tree, nss_tree, specinfer_tree, spectr_tree, khisti_tree]
  exclude_losses: [ebe, ebe_single, ebe_tree,
                   online, online_ebe, online_ebe_single, online_kl_tree, online_ebe_tree]
