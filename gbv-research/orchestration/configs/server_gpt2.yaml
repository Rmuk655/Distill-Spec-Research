# server_gpt2.yaml — GPT-2 convergence run (ATS Cloud, CPU-only, 128 GB RAM)
# Inherits platform settings from bases/server.yaml; adds distilgpt2→gpt2-medium pair.
#
# Draft:  distilgpt2   (82 M,  ~330 MB)
# Target: gpt2-medium  (355 M, ~1.4 GB)
# vocab_size = 50257 for both — SD requirement satisfied.
#
# PURPOSE: Run all GPT-2 loss variants on the ATS Cloud server when GPU credits
# (Kaggle/Colab) are exhausted.  CPU-only — no CUDA needed.
# Results ARE research-meaningful: 4.3x model-size gap → real distillation signal.
#
# RUNNING:
#   Option A — sequential (simple, ~30-50 hr total):
#     python orchestration/experiment.py --config server_gpt2 --yes
#
#   Option B — parallel trainer.py calls (~4-6 hr for all losses):
#     for loss in kl rev_kl jsd l1 kl_tree rev_kl_tree jsd_tree bv_tree \
#                 gbv_tree traversal_tree naive_tree nss_tree specinfer_tree \
#                 spectr_tree khisti_tree; do
#       python algorithms/distillspec_gbv/trainer.py \
#         --model_family gpt2 --draft distilgpt2 --target gpt2-medium \
#         --loss $loss --steps 1000 --device cpu --no_wandb \
#         --output db/checkpoints/${loss}-dg2-g2m &
#     done
#     wait   # 128 GB RAM runs all 15 losses in parallel
#
# NOTE: server_gpt2 inherits from bases/server (CPU platform), NOT from
# laptop_gpt2.  They share the same model pair but are different hardware.

_base: bases/server   # CPU hardware + eval + health + dataset — see bases/server.yaml

models:
  family: gpt2
  draft:  distilgpt2
  target: gpt2-medium

training:
  steps: 1000                   # 2x laptop_gpt2
  lr: 1.0e-4
  lora_r: 8
  lora_alpha: 16
  max_new_tokens: 32
  teacher_temperature: 1.0
  online_lr: 1.0e-3
  seed: 42
  grad_clip: 1.0
  lora_dropout: 0.05
  ebe_kl_weight: 0.1
  jsd_alpha: 0.5
  max_train_prompts: 200        # 1000 steps / 200 prompts = 5 epochs
                                # GPT-2-M teacher is weak (4.3x gap on CPU) —
                                # needs 5 epochs to show clear convergence trend

logging:
  wandb_group: server-gpt2-gsm8k
  run_label: "gpt2-cpu-server"

health:
  val_every: 200
  ppl_check_every: 500

checkpointing:
  save_every: 200
  milestone_every: 1000

experiment:
  exclude_losses: [ebe, ebe_single, ebe_tree,
                   online, online_ebe, online_ebe_single, online_kl_tree, online_ebe_tree]
